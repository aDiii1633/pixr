    CANONICAL_ID: x_v2.webhook.update
STRUCTS:
  ActivityStreamResponse_data:
    - name: event_type
      TYPE: STRING
      REQUIRED: false
    - name: event_uuid
      TYPE: STRING
      REQUIRED: false
    - name: filter
      TYPE: STRUCT(ActivitySubscriptionFilter)
      REQUIRED: false
    - name: includes
      TYPE: STRUCT(Expansions)
      REQUIRED: false
    - name: payload
      TYPE: STRUCT(ActivityStreamingResponsePayload)
      REQUIRED: false
