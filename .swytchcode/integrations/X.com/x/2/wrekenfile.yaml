      - until_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          PATTERN: ^[0-9]{1,19}$
          STYLE: form
      - exclude:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
          MIN_ITEMS: 1
          UNIQUE_ITEMS: true
          STYLE: form
          EXPLODE: false
      - post.fields:
