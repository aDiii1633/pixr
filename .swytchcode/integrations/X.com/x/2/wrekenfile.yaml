      TYPE: "[]STRUCT(ArticleCreateDraftContentStateEntitiesValueDataMediaItems)"
      REQUIRED: false
      comment: Media keys. Used with type image.
    - name: post_id
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the post to embed. Used with type post.
    - name: url
      TYPE: STRING
      REQUIRED: false
