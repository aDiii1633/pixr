      REQUIRED: true
  ArticleCreateDraftContentStateEntitiesValue:
    - name: data
      TYPE: STRUCT(ArticleCreateDraftContentStateEntitiesValueData)
      REQUIRED: true
      comment: "Entity payload. Fields depend on the entity type: post_id (post), url (link),          media_items (image), entity_key (emoji and other opaque keys), markdown (markdown /          code blocks / GFM tables). divider and latex use an empty data object; latex source          is the block text; emoji uses block text for the character(s). There is no separate          table entity type in article storage; tables are markdown."
    - name: mutability
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - immutable
        - mutable
        - segmented
      comment: "Whether the entity can be edited. Recommended: immutable for post, image, divider, latex; mutable for link and markdown (matches the in-app Articles composer)."
    - name: type
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - post
        - link
        - image
        - emoji
        - markdown
        - divider
        - latex
      comment: The entity type. markdown carries code blocks, GFM tables, and other Markdown;          emoji maps to backend TWEMOJI (Twemoji is internal); divider is a horizontal rule;          latex renders TeX from the block text. Tables are not a separate enum value — use          type markdown with a pipe table in data.markdown.
