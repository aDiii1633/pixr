    CANONICAL_ID: x_v2.webhook.create
  x_v2.webhook.replay.create:
    SUMMARY: Create replay job for webhook
    DESC: Creates a replay job to retrieve events from up to the past 24 hours for all events delivered or attempted to be delivered to the webhook.
    HTTP:
      METHOD: POST
      ENDPOINT: /2/webhooks/replay
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
