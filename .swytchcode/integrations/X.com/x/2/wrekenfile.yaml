      TYPE: "[]STRUCT(ArticleCreateDraftContentStateBlocksInlineStyleRanges)"
      REQUIRED: false
      comment: Inline formatting ranges.
    - name: key
      TYPE: STRING
      REQUIRED: false
      comment: Optional block key.
    - name: text
      TYPE: STRING
      REQUIRED: true
      comment: The text content of this block. For latex entities, this holds the LaTeX source;          for divider/markdown/image/post atomic placeholders, typically a single space.
    - name: type
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - unstyled
        - header-one
        - header-two
        - header-three
        - unordered-list-item
        - ordered-list-item
        - blockquote
        - atomic
      comment: The block type. Use atomic for non-text embeds (image, post, markdown, divider, latex).
  ArticleCreateDraftContentStateBlocksData:
    - name: cashtags
      TYPE: "[]STRUCT(ArticleCreateDraftContentStateBlocksDataCashtags)"
      REQUIRED: false
      comment: Cashtag spans in this block.
    - name: hashtags
      TYPE: "[]STRUCT(ArticleCreateDraftContentStateBlocksDataHashtags)"
      REQUIRED: false
      comment: Hashtag spans in this block.
    - name: mentions
      TYPE: "[]STRUCT(ArticleCreateDraftContentStateBlocksDataMentions)"
      REQUIRED: false
      comment: Mention spans in this block.
    - name: urls
      TYPE: "[]STRUCT(ArticleCreateDraftContentStateBlocksDataUrls)"
      REQUIRED: false
      comment: URL spans in this block.
