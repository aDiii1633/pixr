VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  OAuth_auth: <OAUTH_CREDENTIALS>
  w_base_url: https://api.x.com
METHODS:
  x_v2.account_activity.count.list:
    SUMMARY: Get Account Activity Subscription Count
    HTTP:
      METHOD: GET
      ENDPOINT: /2/account_activity/subscriptions/count
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - BearerToken:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(GetAccountActivitySubscriptionCountResponse)
        RETURNVAR: x_v2_account_activity_count_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.account_activity.count.list
  x_v2.account_activity.all.get:
    SUMMARY: Validate Account Activity Subscription
    HTTP:
      METHOD: GET
      ENDPOINT: /2/account_activity/webhooks/{webhook_id}/subscriptions/all
      HEADERS:
        Authorization: <OAuth_auth>
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - dm.read
            - dm.write
            - users.read
            - tweet.read
      - UserToken:
          type: http
          scheme: OAuth
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - webhook_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          STYLE: simple
    RETURNS:
      - RETURNTYPE: STRUCT(ValidateAccountActivitySubscriptionResponse)
        RETURNVAR: x_v2_account_activity_all_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.account_activity.all.get
  x_v2.account_activity.all.create:
    SUMMARY: Create subscription
    DESC: Creates an Account Activity subscription for the user and the given webhook.
    HTTP:
      METHOD: POST
      ENDPOINT: /2/account_activity/webhooks/{webhook_id}/subscriptions/all
      HEADERS:
        Content-Type: application/json
        Authorization: <OAuth_auth>
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(CreateAccountActivitySubscriptionRequest)
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - tweet.read
            - users.read
            - dm.write
            - dm.read
      - UserToken:
          type: http
          scheme: OAuth
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - webhook_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          STYLE: simple
      - body:
          TYPE: STRUCT(CreateAccountActivitySubscriptionRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(CreateAccountActivitySubscriptionResponse)
        RETURNVAR: x_v2_account_activity_all_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.account_activity.all.create
  x_v2.account_activity.all.list:
    SUMMARY: Get Account Activity Subscriptions
    HTTP:
      METHOD: GET
      ENDPOINT: /2/account_activity/webhooks/{webhook_id}/subscriptions/all/list
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - BearerToken:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - webhook_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          STYLE: simple
    RETURNS:
      - RETURNTYPE: STRUCT(GetAccountActivitySubscriptionsResponse)
        RETURNVAR: x_v2_account_activity_all_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.account_activity.all.list
  x_v2.account_activity.all.delete:
    SUMMARY: Delete subscription
    DESC: Deletes an Account Activity subscription for the given webhook and user ID.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /2/account_activity/webhooks/{webhook_id}/subscriptions/{user_id}/all
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - BearerToken:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - webhook_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          STYLE: simple
      - user_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          STYLE: simple
    RETURNS:
      - RETURNTYPE: STRUCT(DeleteAccountActivitySubscriptionResponse)
        RETURNVAR: x_v2_account_activity_all_delete
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.account_activity.all.delete
  x_v2.activity.stream.list:
    SUMMARY: Activity Stream
    DESC: Stream of X Activities
    HTTP:
      METHOD: GET
      ENDPOINT: /2/activity/stream
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - BearerToken:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - backfill_minutes:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          FORMAT: int32
          MINIMUM: 0
          MAXIMUM: 5
          STYLE: form
      - start_time:
          TYPE: TIMESTAMP
          REQUIRED: false
          LOCATION: query
          FORMAT: date-time
          STYLE: form
      - end_time:
          TYPE: TIMESTAMP
          REQUIRED: false
          LOCATION: query
          FORMAT: date-time
          STYLE: form
    RETURNS:
      - RETURNTYPE: STRUCT(ActivityStreamResponse)
        RETURNVAR: x_v2_activity_stream_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.activity.stream.list
  x_v2.activity.subscriptions.delete:
    SUMMARY: Delete X activity subscriptions by IDs
    DESC: Deletes multiple subscriptions for X activity events by their IDs
    HTTP:
      METHOD: DELETE
      ENDPOINT: /2/activity/subscriptions
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - BearerToken:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - ids:
          TYPE: "[]STRING"
          REQUIRED: true
          LOCATION: query
          MIN_ITEMS: 1
          MAX_ITEMS: 100
          STYLE: form
          EXPLODE: false
    RETURNS:
      - RETURNTYPE: STRUCT(DeleteActivitySubscriptionsByIdsResponse)
        RETURNVAR: x_v2_activity_subscriptions_delete
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.activity.subscriptions.delete
  x_v2.activity.subscriptions.list:
    SUMMARY: Get X activity subscriptions
    DESC: Get a list of active subscriptions for XAA
    HTTP:
      METHOD: GET
      ENDPOINT: /2/activity/subscriptions
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - tweet.read
            - like.read
      - UserToken:
          type: http
          scheme: OAuth
      - BearerToken:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - max_results:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          FORMAT: int32
          MINIMUM: 1
          MAXIMUM: 1000
          STYLE: form
      - pagination_token:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          MIN_LENGTH: 16
          STYLE: form
    RETURNS:
      - RETURNTYPE: STRUCT(GetActivitySubscriptionsResponse)
        RETURNVAR: x_v2_activity_subscriptions_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.activity.subscriptions.list
  x_v2.activity.subscriptions.create:
    SUMMARY: Create X activity subscription
    DESC: "Creates a subscription for an X activity event. OAuth2 user-context tokens must hold the scope matching the requested event_type: dm.read for chat.* and dm.* events, like.read for like.* events, mute.read for mute.* events, block.read for block.* events, and tweet.read for all other event types. Mute and block subscriptions are actor-only: filter.user_id must identify the authenticated user and direction is not supported."
    HTTP:
      METHOD: POST
      ENDPOINT: /2/activity/subscriptions
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(CreateActivitySubscriptionRequest)
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
      - UserToken:
          type: http
          scheme: OAuth
      - BearerToken:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(CreateActivitySubscriptionRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(CreateActivitySubscriptionResponse)
        RETURNVAR: x_v2_activity_subscriptions_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.activity.subscriptions.create
  x_v2.activity.subscriptions.delete1:
    SUMMARY: Deletes X activity subscription
    DESC: Deletes a subscription for an X activity event
    HTTP:
      METHOD: DELETE
      ENDPOINT: /2/activity/subscriptions/{subscription_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - BearerToken:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - subscription_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          PATTERN: ^[0-9]{1,19}$
          STYLE: simple
    RETURNS:
      - RETURNTYPE: STRUCT(DeleteActivitySubscriptionResponse)
        RETURNVAR: x_v2_activity_subscriptions_delete1
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.activity.subscriptions.delete1
  x_v2.activity.subscriptions.update:
    SUMMARY: Update X activity subscription
    DESC: Updates a subscription for an X activity event
    HTTP:
      METHOD: PUT
      ENDPOINT: /2/activity/subscriptions/{subscription_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(UpdateActivitySubscriptionRequest)
    SECURITY:
      - BearerToken:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - subscription_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          PATTERN: ^[0-9]{1,19}$
          STYLE: simple
      - body:
          TYPE: STRUCT(UpdateActivitySubscriptionRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(UpdateActivitySubscriptionResponse)
        RETURNVAR: x_v2_activity_subscriptions_update
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.activity.subscriptions.update
  x_v2.article.draft.create:
    SUMMARY: Create draft Article
    DESC: Creates a new Article draft that can later be published.
    HTTP:
      METHOD: POST
      ENDPOINT: /2/articles/draft
      HEADERS:
        Content-Type: application/json
        Authorization: <OAuth_auth>
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ArticleCreateDraftRequest)
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - tweet.write
      - UserToken:
          type: http
          scheme: OAuth
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(ArticleCreateDraftRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(ArticleCreateDraftResponse)
        RETURNVAR: x_v2_article_draft_create_201
        STATUS: 201
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.article.draft.create
  x_v2.article.publish.create:
    SUMMARY: Publish Article
    DESC: Publishes a draft Article, making it publicly visible.
    HTTP:
      METHOD: POST
      ENDPOINT: /2/articles/{article_id}/publish
      HEADERS:
        Content-Type: application/json
        Authorization: <OAuth_auth>
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - tweet.write
      - UserToken:
          type: http
          scheme: OAuth
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - article_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          PATTERN: ^[0-9]{1,19}$
          STYLE: simple
    RETURNS:
      - RETURNTYPE: STRUCT(ArticlePublishResponse)
        RETURNVAR: x_v2_article_publish_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.article.publish.create
  x_v2.broadcast.list:
    SUMMARY: List broadcasts
    DESC: |-
      Returns the authenticated user's live-video broadcasts, or selected owned broadcasts when ids are provided.

      At most one of `ids`, `max_results` may be provided. At most one of `ids`, `pagination_token` may be provided.
    HTTP:
      METHOD: GET
      ENDPOINT: /2/broadcasts
      HEADERS:
        Authorization: <OAuth_auth>
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - broadcast.read
      - UserToken:
          type: http
          scheme: OAuth
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - ids:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
          MIN_ITEMS: 1
          MAX_ITEMS: 100
          STYLE: form
          EXPLODE: false
      - max_results:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          FORMAT: int32
          MINIMUM: 1
          MAXIMUM: 100
          STYLE: form
      - pagination_token:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          MIN_LENGTH: 1
          STYLE: form
      - broadcast.fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
          MIN_ITEMS: 1
          UNIQUE_ITEMS: true
          STYLE: form
          EXPLODE: false
    RETURNS:
      - RETURNTYPE: STRUCT(ListBroadcastsResponse)
        RETURNVAR: x_v2_broadcast_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.broadcast.list
  x_v2.broadcast.scheduled.list:
    SUMMARY: List scheduled broadcasts
    DESC: Returns scheduled broadcasts owned by the authenticated user.
    HTTP:
      METHOD: GET
      ENDPOINT: /2/broadcasts/scheduled
      HEADERS:
        Authorization: <OAuth_auth>
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - broadcast.read
      - UserToken:
          type: http
          scheme: OAuth
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - max_results:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          FORMAT: int32
          MINIMUM: 1
          MAXIMUM: 100
          STYLE: form
      - oldest_start_time:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          STYLE: form
      - newest_start_time:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          STYLE: form
      - pagination_token:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          STYLE: form
    RETURNS:
      - RETURNTYPE: STRUCT(ListScheduledBroadcastsResponse)
        RETURNVAR: x_v2_broadcast_scheduled_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.broadcast.scheduled.list
  x_v2.broadcast.scheduled.create:
    SUMMARY: Create a scheduled broadcast
    DESC: Schedules a one-off or recurring broadcast for the authenticated user. A `source_id` (ingest) is required at create time.
    HTTP:
      METHOD: POST
      ENDPOINT: /2/broadcasts/scheduled
      HEADERS:
        Content-Type: application/json
        Authorization: <OAuth_auth>
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(CreateScheduledBroadcastRequest)
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - broadcast.write
            - broadcast.read
      - UserToken:
          type: http
          scheme: OAuth
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(CreateScheduledBroadcastRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(CreateScheduledBroadcastResponse)
        RETURNVAR: x_v2_broadcast_scheduled_create_201
        STATUS: 201
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.broadcast.scheduled.create
  x_v2.broadcast.scheduled.delete:
    SUMMARY: Delete a scheduled broadcast
    DESC: Deletes a scheduled broadcast by its alphanumeric UBS broadcast id.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /2/broadcasts/scheduled/{id}
      HEADERS:
        Authorization: <OAuth_auth>
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - broadcast.write
            - broadcast.read
      - UserToken:
          type: http
          scheme: OAuth
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          PATTERN: ^[a-zA-Z0-9]{1,13}$
          STYLE: simple
      - roll_forward:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
          STYLE: form
    RETURNS:
      - RETURNTYPE: STRUCT(DeleteScheduledBroadcastResponse)
        RETURNVAR: x_v2_broadcast_scheduled_delete
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.broadcast.scheduled.delete
  x_v2.broadcast.scheduled.get:
    SUMMARY: Get a scheduled broadcast
    DESC: Returns a single scheduled broadcast by its alphanumeric UBS broadcast id.
    HTTP:
      METHOD: GET
      ENDPOINT: /2/broadcasts/scheduled/{id}
      HEADERS:
        Authorization: <OAuth_auth>
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - broadcast.read
      - UserToken:
          type: http
          scheme: OAuth
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          PATTERN: ^[a-zA-Z0-9]{1,13}$
          STYLE: simple
    RETURNS:
      - RETURNTYPE: STRUCT(GetScheduledBroadcastResponse)
        RETURNVAR: x_v2_broadcast_scheduled_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.broadcast.scheduled.get
  x_v2.broadcast.scheduled.update:
    SUMMARY: Update a scheduled broadcast
    DESC: Fully replaces schedule fields for a broadcast. Path `:id` is the UBS broadcast id; the body must include `scheduled_broadcast_id` and re-send any fields that should be kept.
    HTTP:
      METHOD: PUT
      ENDPOINT: /2/broadcasts/scheduled/{id}
      HEADERS:
        Content-Type: application/json
        Authorization: <OAuth_auth>
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(UpdateScheduledBroadcastRequest)
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - broadcast.read
            - broadcast.write
      - UserToken:
          type: http
          scheme: OAuth
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          PATTERN: ^[a-zA-Z0-9]{1,13}$
          STYLE: simple
      - body:
          TYPE: STRUCT(UpdateScheduledBroadcastRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(UpdateScheduledBroadcastResponse)
        RETURNVAR: x_v2_broadcast_scheduled_update
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.broadcast.scheduled.update
  x_v2.broadcast.live.create:
    SUMMARY: Go live on a scheduled broadcast
    DESC: "Publishes a schedule that was created or updated with `manual_publish: true`. Without that flag the coordinator auto-publishes at start and this call is rejected."
    HTTP:
      METHOD: POST
      ENDPOINT: /2/broadcasts/scheduled/{id}/live
      HEADERS:
        Content-Type: application/json
        Authorization: <OAuth_auth>
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - broadcast.write
            - broadcast.read
      - UserToken:
          type: http
          scheme: OAuth
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          PATTERN: ^[a-zA-Z0-9]{1,13}$
          STYLE: simple
    RETURNS:
      - RETURNTYPE: STRUCT(GoLiveScheduledBroadcastResponse)
        RETURNVAR: x_v2_broadcast_live_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: The request has failed. (HTTP default)
    CANONICAL_ID: x_v2.broadcast.live.create
  x_v2.broadcast.get:
    SUMMARY: Get a broadcast
    DESC: Returns a broadcast owned by the authenticated user.
    HTTP:
      METHOD: GET
      ENDPOINT: /2/broadcasts/{id}
      HEADERS:
        Authorization: <OAuth_auth>
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - OAuth2UserToken:
          type: oauth2
          scopes:
            - broadcast.read
      - UserToken:
          type: http
          scheme: OAuth
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
