    - name: caption
      TYPE: STRING
      REQUIRED: false
      comment: Caption text.
    - name: entity_key
      TYPE: STRING
      REQUIRED: false
      comment: Opaque entity key. Used with type emoji (and reserved for other keyed embeds) to match in-app Articles composer payloads.
    - name: markdown
      TYPE: STRING
      REQUIRED: false
      comment: Markdown body for type markdown. Use fenced code blocks (```lang ... ```) for code. Max weighted length is enforced by the Articles backend (10,000 per article).
