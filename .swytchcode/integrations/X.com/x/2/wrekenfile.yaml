          REQUIRED: false
          LOCATION: query
          MIN_ITEMS: 1
          UNIQUE_ITEMS: true
          STYLE: form
          EXPLODE: false
      - place.fields:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
          MIN_ITEMS: 1
          UNIQUE_ITEMS: true
          STYLE: form
          EXPLODE: false
