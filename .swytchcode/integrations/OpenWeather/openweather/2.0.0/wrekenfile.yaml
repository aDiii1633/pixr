STRUCTS:
  Coord:
    - name: lat
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
    - name: lon
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
  Wind:
    - name: speed
      TYPE: FLOAT
      REQUIRED: false
      comment: m/s or mph
    - name: deg
      TYPE: INT
      REQUIRED: false
      comment: Wind direction, degrees
    - name: gust
      TYPE: FLOAT
      REQUIRED: false
      comment: m/s or mph
  MainReadings:
    - name: temp
      TYPE: FLOAT
      REQUIRED: false
    - name: feels_like
      TYPE: FLOAT
      REQUIRED: false
    - name: temp_min
      TYPE: FLOAT
      REQUIRED: false
    - name: temp_max
      TYPE: FLOAT
      REQUIRED: false
    - name: pressure
      TYPE: INT
      REQUIRED: false
      comment: Sea-level pressure, hPa
    - name: humidity
      TYPE: INT
      REQUIRED: false
      comment: Humidity, %
    - name: sea_level
      TYPE: INT
      REQUIRED: false
      comment: hPa
    - name: grnd_level
      TYPE: INT
      REQUIRED: false
      comment: hPa
    - name: temp_kf
      TYPE: FLOAT
      REQUIRED: false
      comment: Internal parameter (forecast only)
  WeatherResponse_clouds:
    - name: all
      TYPE: INT
      REQUIRED: false
      comment: Cloudiness, %
  WeatherResponse_sys:
    - name: type
      TYPE: INT
      REQUIRED: false
    - name: id
      TYPE: INT
      REQUIRED: false
    - name: country
      TYPE: STRING
      REQUIRED: false
      comment: ISO 3166 country code
    - name: sunrise
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
    - name: sunset
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
  WeatherResponse:
    - name: coord
      TYPE: STRUCT(Coord)
      REQUIRED: false
    - name: weather
      TYPE: "[]STRUCT(WeatherCondition)"
      REQUIRED: false
    - name: base
      TYPE: STRING
      REQUIRED: false
    - name: main
      TYPE: STRUCT(MainReadings)
      REQUIRED: false
    - name: visibility
      TYPE: INT
      REQUIRED: false
      comment: Metres, max 10000
    - name: wind
      TYPE: STRUCT(Wind)
      REQUIRED: false
    - name: rain
      TYPE: STRUCT(Precipitation1h)
      REQUIRED: false
    - name: snow
      TYPE: STRUCT(Precipitation1h)
      REQUIRED: false
    - name: clouds
      TYPE: STRUCT(WeatherResponse_clouds)
      REQUIRED: false
    - name: dt
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
    - name: sys
      TYPE: STRUCT(WeatherResponse_sys)
      REQUIRED: false
    - name: timezone
      TYPE: INT
      REQUIRED: false
      comment: Shift in seconds from UTC
    - name: id
      TYPE: INT
      REQUIRED: false
      comment: City ID
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: City name
    - name: cod
      TYPE: INT
      REQUIRED: false
  Precipitation3h:
    - name: 3h
      TYPE: FLOAT
      REQUIRED: false
      comment: Volume for the last 3 hours, mm
  ForecastItem_clouds:
    - name: all
      TYPE: INT
      REQUIRED: false
  ForecastItem_sys:
    - name: pod
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - d
        - "n"
      comment: Part of day
  ForecastItem:
    - name: dt
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
    - name: main
      TYPE: STRUCT(MainReadings)
      REQUIRED: false
    - name: weather
      TYPE: "[]STRUCT(WeatherCondition)"
      REQUIRED: false
    - name: clouds
      TYPE: STRUCT(ForecastItem_clouds)
      REQUIRED: false
    - name: wind
      TYPE: STRUCT(Wind)
      REQUIRED: false
    - name: visibility
      TYPE: INT
      REQUIRED: false
