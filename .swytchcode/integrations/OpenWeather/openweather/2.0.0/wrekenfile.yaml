VERSION: 2.0.2
DEFAULTS:
  w_base_url: https://api.openweathermap.org
METHODS:
  openweather.2.5.weather.list:
    SUMMARY: Current weather (2.5)
    DESC: Current weather for the given coordinates. Available on the free plan.
    HTTP:
      METHOD: GET
      ENDPOINT: /data/2.5/weather
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY: []
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - lat:
          TYPE: FLOAT
          REQUIRED: true
          LOCATION: query
          FORMAT: double
          MINIMUM: -90
          MAXIMUM: 90
      - lon:
          TYPE: FLOAT
          REQUIRED: true
          LOCATION: query
          FORMAT: double
          MINIMUM: -180
          MAXIMUM: 180
      - units:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          DEFAULT: standard
          ENUM:
            - standard
            - metric
            - imperial
      - lang:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - sq
            - af
            - ar
            - az
            - eu
            - be
            - bg
            - ca
            - zh_cn
            - zh_tw
            - hr
            - cz
            - da
            - nl
            - en
            - fi
            - fr
            - gl
            - de
            - el
            - he
            - hi
            - hu
            - is
            - id
            - it
            - ja
            - kr
            - ku
            - la
            - lt
            - mk
            - "no"
            - fa
            - pl
            - pt
            - pt_br
            - ro
            - ru
            - sr
            - sk
            - sl
            - sp
            - es
            - sv
            - se
            - th
            - tr
            - ua
            - uk
            - vi
            - zu
      - appid:
          TYPE: STRING
          REQUIRED: true
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(WeatherResponse)
        RETURNVAR: openweather_2_5_weather_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 400
        WHEN: Missing or invalid parameters. (HTTP 400)
      - TYPE: STRUCT(Error)
        STATUS: 401
        WHEN: Missing or invalid API key, or no One Call subscription. (HTTP 401)
      - TYPE: STRUCT(Error)
        STATUS: 404
        WHEN: No data available for the requested parameters. (HTTP 404)
      - TYPE: STRUCT(Error)
        STATUS: 429
        WHEN: Call quota exceeded. (HTTP 429)
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: Unexpected server error (5xx). (HTTP default)
    CANONICAL_ID: openweather.2.5.weather.list
  openweather.2.5.forecast.list:
