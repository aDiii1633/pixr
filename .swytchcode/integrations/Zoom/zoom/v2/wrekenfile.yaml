STRUCTS:
  Account:
    - name: first_name
      TYPE: STRING
      REQUIRED: true
      comment: User's first name
    - name: last_name
      TYPE: STRING
      REQUIRED: true
      comment: User's last name
    - name: email
      TYPE: STRING
      REQUIRED: true
      comment: User's email address
    - name: password
      TYPE: STRING
      REQUIRED: true
      MINIMUM: 8
      comment: User's password
    - name: options
      TYPE: STRUCT(AccountOptions)
      REQUIRED: false
  AccountList_accounts_Item:
    - name: id
      TYPE: STRING
      REQUIRED: false
      FORMAT: uuid
      comment: Account ID
    - name: account_name
      TYPE: STRING
      REQUIRED: false
      comment: Account name
    - name: owner_email
      TYPE: STRING
      REQUIRED: false
      comment: Account owner email
    - name: account_type
      TYPE: STRING
      REQUIRED: false
      comment: Account type
    - name: seats
      TYPE: INT
      REQUIRED: false
      comment: Account seats
    - name: subscription_start_time
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: Account subscription start date/time
    - name: subscription_end_time
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: Account subscription end date/time
    - name: created_at
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: Account creation date/time
  AccountList:
    - name: page_count
      TYPE: INT
      REQUIRED: false
      comment: The number of items returned on this page
    - name: page_number
      TYPE: INT
      REQUIRED: false
      DEFAULT: 1
      comment: The page number of current results
    - name: page_size
      TYPE: INT
      REQUIRED: false
      MAXIMUM: 300
      DEFAULT: 30
      comment: The number of records returned within a single API call
    - name: total_records
      TYPE: INT
      REQUIRED: false
      comment: The number of all records available across pages
    - name: accounts
      TYPE: "[]STRUCT(AccountList_accounts_Item)"
      REQUIRED: false
      comment: List of Account objects
  AccountOptions:
    - name: share_rc
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: Enable Share Virtual Room Connector
    - name: room_connectors
      TYPE: STRING
      REQUIRED: false
      comment: Virtual Room Connector, multiple value separated by comma
    - name: share_mc
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: Enable Share Meeting Connector
    - name: meeting_connectors
      TYPE: STRING
      REQUIRED: false
      comment: Meeting Connector, multiple values separated by comma
    - name: pay_mode
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - master
        - sub
      DEFAULT: master
      comment: Payee
  AccountPlan:
    - name: type
      TYPE: STRING
      REQUIRED: false
      comment: Account <a href="#plans">plan type</a>
    - name: hosts
      TYPE: INT
      REQUIRED: false
      comment: Account plan number of hosts
  AccountPlanBaseRequired:
    - name: type
      TYPE: STRING
      REQUIRED: true
      comment: Account base <a href="#plans">plan type</a>
    - name: hosts
      TYPE: INT
      REQUIRED: true
      comment: Account base plan number of hosts. For a Pro Plan, please select a value between 1 and 9. For a Business Plan, please select a value between 10 and 49. For a Education Plan, please select a value between 20 and 149. For a Free Trial Plan, please select a value between 1 and 9999.
  AccountPlanRequired:
    - name: type
      TYPE: STRING
      REQUIRED: true
      comment: Account <a href="#plans">plan type</a>
    - name: hosts
      TYPE: INT
      REQUIRED: true
      comment: Account plan number of hosts
  AccountPlans_plan_audio:
    - name: type
      TYPE: STRING
      REQUIRED: false
      comment: Additional Audio Conferencing <a href="#plans">plan type</a>
    - name: tollfree_countries
      TYPE: STRING
      REQUIRED: false
      comment: Toll-free countries, multiple value separated by comma
    - name: premium_countries
      TYPE: STRING
      REQUIRED: false
      comment: Premium countries, multiple value separated by comma
    - name: callout_countries
      TYPE: STRING
      REQUIRED: false
      comment: Call-out countries, multiple value separated by comma
    - name: ddi_numbers
      TYPE: INT
      REQUIRED: false
      comment: Dedicated Dial-In Numbers
  AccountPlans:
    - name: plan_base
      TYPE: STRUCT(AccountPlanBaseRequired)
      REQUIRED: false
    - name: plan_zoom_rooms
      TYPE: STRUCT(AccountPlan)
      REQUIRED: false
    - name: plan_room_connector
      TYPE: STRUCT(AccountPlan)
      REQUIRED: false
    - name: plan_large_meeting
      TYPE: "[]STRUCT(AccountPlan)"
      REQUIRED: false
      comment: Additional Large Meeting Plans
    - name: plan_webinar
      TYPE: "[]STRUCT(AccountPlan)"
      REQUIRED: false
      comment: Additional Webinar Plans
    - name: plan_recording
      TYPE: STRING
      REQUIRED: false
      comment: Additional Cloud Recording Plan
    - name: plan_audio
      TYPE: STRUCT(AccountPlans_plan_audio)
      REQUIRED: false
      comment: Additional Audio Conferencing <a href="#plans">plan type</a>
  AccountSettings:
    - name: schedule_meting
