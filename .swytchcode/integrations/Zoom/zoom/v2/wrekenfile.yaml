VERSION: 2.0.2
DEFAULTS:
  query_access_token: <ACCESS_TOKEN>
  w_base_url: https://api.zoom.us/v2
METHODS:
  zoom.account.list:
    SUMMARY: List sub accounts
    DESC: List all the sub accounts under the master account
    HTTP:
      METHOD: GET
      ENDPOINT: /accounts
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - global:
          type: apiKey
          in: query
          name: access_token
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(AccountList)
        RETURNVAR: zoom_account_list
        STATUS: 200
    CANONICAL_ID: zoom.account.list
  zoom.account.create:
    SUMMARY: Create a sub account
    DESC: Create a sub account under the master account. <aside>Your account must be a master account and have this privilege to create sub account. Zoom only assigns this privilege to trusted partners. The created user will not receive a confirmation email.</aside>.
    HTTP:
      METHOD: POST
      ENDPOINT: /accounts
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Account)
    SECURITY:
      - global:
          type: apiKey
          in: query
          name: access_token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(Account)
          REQUIRED: true
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(accountCreate_post_accounts_8db5d394Response201)
        RETURNVAR: zoom_account_create_201
        STATUS: 201
    ERRORS:
      - TYPE: ANY
        STATUS: 409
        WHEN: Account with that email already exists (HTTP 409)
    CANONICAL_ID: zoom.account.create
  zoom.account.get:
    SUMMARY: Retrieve a sub account
    DESC: Retrieve a sub account under the master account. <aside>Your account must be a master account and have this privilege to read sub accounts. Zoom only assigns this privilege to trusted partners</aside>.
    HTTP:
      METHOD: GET
      ENDPOINT: /accounts/{accountId}
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - global:
          type: apiKey
          in: query
          name: access_token
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(account_get_accounts_accountId_783e6115Response200)
        RETURNVAR: zoom_account_get
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 404
        WHEN: User not found (HTTP 404)
    CANONICAL_ID: zoom.account.get
  zoom.account.delete:
    SUMMARY: Disassociate an account
    DESC: Disassociate a sub account from the master account. This will leave the account intact but the sub account will not longer be associated with the master account.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /accounts/{accountId}
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - global:
          type: apiKey
          in: query
          name: access_token
    EXECUTION:
      KIND: http
      MODE: sync
    ERRORS:
      - TYPE: ANY
        STATUS: 404
        WHEN: Account not found (HTTP 404)
    CANONICAL_ID: zoom.account.delete
