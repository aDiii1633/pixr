        - CUSTOM
      comment: The type of the shape.
    - name: text
      TYPE: STRUCT(TextContent)
      REQUIRED: false
      comment: The text content of the shape.
  ShapeBackgroundFill:
    - name: propertyState
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RENDERED
        - NOT_RENDERED
        - INHERIT
      comment: The background fill property state. Updating the fill on a shape will implicitly update this field to `RENDERED`, unless another value is specified in the same request. To have no fill on a shape, set this field to `NOT_RENDERED`. In this case, any other fill fields set in the same request will be ignored.
    - name: solidFill
      TYPE: STRUCT(SolidFill)
      REQUIRED: false
      comment: Solid color fill.
  ShapeProperties:
    - name: autofit
      TYPE: STRUCT(Autofit)
      REQUIRED: false
      comment: The autofit properties of the shape. This property is only set for shapes that allow text.
    - name: contentAlignment
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - CONTENT_ALIGNMENT_UNSPECIFIED
        - CONTENT_ALIGNMENT_UNSUPPORTED
        - TOP
        - MIDDLE
        - BOTTOM
      comment: The alignment of the content in the shape. If unspecified, the alignment is inherited from a parent placeholder if it exists. If the shape has no parent, the default alignment matches the alignment for new shapes created in the Slides editor.
    - name: link
      TYPE: STRUCT(Link)
      REQUIRED: false
      comment: The hyperlink destination of the shape. If unset, there is no link. Links are not inherited from parent placeholders.
    - name: outline
      TYPE: STRUCT(Outline)
      REQUIRED: false
      comment: The outline of the shape. If unset, the outline is inherited from a parent placeholder if it exists. If the shape has no parent, then the default outline depends on the shape type, matching the defaults for new shapes created in the Slides editor.
    - name: shadow
      TYPE: STRUCT(Shadow)
      REQUIRED: false
      comment: The shadow properties of the shape. If unset, the shadow is inherited from a parent placeholder if it exists. If the shape has no parent, then the default shadow matches the defaults for new shapes created in the Slides editor. This property is read-only.
    - name: shapeBackgroundFill
      TYPE: STRUCT(ShapeBackgroundFill)
      REQUIRED: false
      comment: The background fill of the shape. If unset, the background fill is inherited from a parent placeholder if it exists. If the shape has no parent, then the default background fill depends on the shape type, matching the defaults for new shapes created in the Slides editor.
  SheetsChart:
    - name: chartId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the specific chart in the Google Sheets spreadsheet that is embedded.
    - name: contentUrl
      TYPE: STRING
      REQUIRED: false
      comment: The URL of an image of the embedded chart, with a default lifetime of 30 minutes. This URL is tagged with the account of the requester. Anyone with the URL effectively accesses the image as the original requester. Access to the image may be lost if the presentation's sharing settings change.
    - name: sheetsChartProperties
      TYPE: STRUCT(SheetsChartProperties)
      REQUIRED: false
      comment: The properties of the Sheets chart.
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the Google Sheets spreadsheet that contains the source chart.
  SheetsChartProperties:
    - name: chartImageProperties
      TYPE: STRUCT(ImageProperties)
      REQUIRED: false
      comment: The properties of the embedded chart image.
  Size:
    - name: height
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: The height of the object.
    - name: width
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: The width of the object.
  SlideProperties:
    - name: isSkipped
      TYPE: BOOL
      REQUIRED: false
      comment: Whether the slide is skipped in the presentation mode. Defaults to false.
    - name: layoutObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the layout that this slide is based on. This property is read-only.
    - name: masterObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the master that this slide is based on. This property is read-only.
    - name: notesPage
      TYPE: STRUCT(Page)
      REQUIRED: false
      comment: The notes page that this slide is associated with. It defines the visual appearance of a notes page when printing or exporting slides with speaker notes. A notes page inherits properties from the notes master. The placeholder shape with type BODY on the notes page contains the speaker notes for this slide. The ID of this shape is identified by the speakerNotesObjectId field. The notes page is read-only except for the text content and styles of the speaker notes shape. This property is read-only.
  SolidFill:
    - name: alpha
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: "The fraction of this `color` that should be applied to the pixel. That is, the final pixel color is defined by the equation: pixel color = alpha * (color) + (1.0 - alpha) * (background color) This means that a value of 1.0 corresponds to a solid color, whereas a value of 0.0 corresponds to a completely transparent color."
    - name: color
      TYPE: STRUCT(OpaqueColor)
      REQUIRED: false
      comment: The color value of the solid fill.
  SpeakerSpotlight:
    - name: speakerSpotlightProperties
      TYPE: STRUCT(SpeakerSpotlightProperties)
      REQUIRED: false
      comment: The properties of the Speaker Spotlight.
  SpeakerSpotlightProperties:
    - name: outline
      TYPE: STRUCT(Outline)
      REQUIRED: false
      comment: The outline of the Speaker Spotlight. If not set, it has no outline.
    - name: shadow
      TYPE: STRUCT(Shadow)
      REQUIRED: false
      comment: The shadow of the Speaker Spotlight. If not set, it has no shadow.
  StretchedPictureFill:
    - name: contentUrl
      TYPE: STRING
      REQUIRED: false
      comment: "Reading the content_url: An URL to a picture with a default lifetime of 30 minutes. This URL is tagged with the account of the requester. Anyone with the URL effectively accesses the picture as the original requester. Access to the picture may be lost if the presentation's sharing settings change. Writing the content_url: The picture is fetched once at insertion time and a copy is stored for display inside the presentation. Pictures must be less than 50MB in size, cannot exceed 25 megapixels, and must be in one of PNG, JPEG, or GIF format. The provided URL can be at most 2 kB in length."
    - name: size
      TYPE: STRUCT(Size)
      REQUIRED: false
      comment: The original size of the picture fill. This field is read-only.
  SubstringMatchCriteria:
    - name: matchCase
      TYPE: BOOL
      REQUIRED: false
      comment: "Indicates whether the search should respect case: - `True`: the search is case sensitive. - `False`: the search is case insensitive."
    - name: searchByRegex
      TYPE: BOOL
      REQUIRED: false
      comment: "Optional. True if the find value should be treated as a regular expression. Any backslashes in the pattern should be escaped. - `True`: the search text is treated as a regular expressions. - `False`: the search text is treated as a substring for matching."
    - name: text
      TYPE: STRING
      REQUIRED: false
      comment: The text to search for in the shape or table.
  Table:
    - name: columns
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Number of columns in the table.
    - name: horizontalBorderRows
      TYPE: "[]STRUCT(TableBorderRow)"
      REQUIRED: false
      comment: Properties of horizontal cell borders. A table's horizontal cell borders are represented as a grid. The grid has one more row than the number of rows in the table and the same number of columns as the table. For example, if the table is 3 x 3, its horizontal borders will be represented as a grid with 4 rows and 3 columns.
    - name: rows
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Number of rows in the table.
    - name: tableColumns
      TYPE: "[]STRUCT(TableColumnProperties)"
      REQUIRED: false
      comment: Properties of each column.
    - name: tableRows
      TYPE: "[]STRUCT(TableRow)"
      REQUIRED: false
      comment: Properties and contents of each row. Cells that span multiple rows are contained in only one of these rows and have a row_span greater than 1.
    - name: verticalBorderRows
      TYPE: "[]STRUCT(TableBorderRow)"
      REQUIRED: false
      comment: Properties of vertical cell borders. A table's vertical cell borders are represented as a grid. The grid has the same number of rows as the table and one more column than the number of columns in the table. For example, if the table is 3 x 3, its vertical borders will be represented as a grid with 3 rows and 4 columns.
  TableBorderCell:
    - name: location
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The location of the border within the border table.
    - name: tableBorderProperties
      TYPE: STRUCT(TableBorderProperties)
      REQUIRED: false
      comment: The border properties.
  TableBorderFill:
    - name: solidFill
      TYPE: STRUCT(SolidFill)
      REQUIRED: false
      comment: Solid fill.
  TableBorderProperties:
    - name: dashStyle
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DASH_STYLE_UNSPECIFIED
        - SOLID
        - DOT
        - DASH
        - DASH_DOT
        - LONG_DASH
        - LONG_DASH_DOT
      comment: The dash style of the border.
    - name: tableBorderFill
      TYPE: STRUCT(TableBorderFill)
      REQUIRED: false
      comment: The fill of the table border.
    - name: weight
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: The thickness of the border.
  TableBorderRow:
    - name: tableBorderCells
      TYPE: "[]STRUCT(TableBorderCell)"
      REQUIRED: false
      comment: Properties of each border cell. When a border's adjacent table cells are merged, it is not included in the response.
  TableCell:
    - name: columnSpan
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Column span of the cell.
    - name: location
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The location of the cell within the table.
    - name: rowSpan
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Row span of the cell.
    - name: tableCellProperties
      TYPE: STRUCT(TableCellProperties)
      REQUIRED: false
      comment: The properties of the table cell.
    - name: text
      TYPE: STRUCT(TextContent)
      REQUIRED: false
      comment: The text content of the cell.
  TableCellBackgroundFill:
    - name: propertyState
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RENDERED
        - NOT_RENDERED
        - INHERIT
      comment: The background fill property state. Updating the fill on a table cell will implicitly update this field to `RENDERED`, unless another value is specified in the same request. To have no fill on a table cell, set this field to `NOT_RENDERED`. In this case, any other fill fields set in the same request will be ignored.
    - name: solidFill
      TYPE: STRUCT(SolidFill)
      REQUIRED: false
      comment: Solid color fill.
  TableCellLocation:
    - name: columnIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The 0-based column index.
    - name: rowIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The 0-based row index.
  TableCellProperties:
    - name: contentAlignment
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - CONTENT_ALIGNMENT_UNSPECIFIED
        - CONTENT_ALIGNMENT_UNSUPPORTED
        - TOP
        - MIDDLE
        - BOTTOM
      comment: The alignment of the content in the table cell. The default alignment matches the alignment for newly created table cells in the Slides editor.
    - name: tableCellBackgroundFill
      TYPE: STRUCT(TableCellBackgroundFill)
      REQUIRED: false
      comment: The background fill of the table cell. The default fill matches the fill for newly created table cells in the Slides editor.
  TableColumnProperties:
    - name: columnWidth
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: Width of a column.
  TableRange:
    - name: columnSpan
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The column span of the table range.
    - name: location
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The starting location of the table range.
    - name: rowSpan
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The row span of the table range.
  TableRow:
    - name: rowHeight
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: Height of a row.
    - name: tableCells
      TYPE: "[]STRUCT(TableCell)"
      REQUIRED: false
      comment: Properties and contents of each cell. Cells that span multiple columns are represented only once with a column_span greater than 1. As a result, the length of this collection does not always match the number of columns of the entire table.
    - name: tableRowProperties
      TYPE: STRUCT(TableRowProperties)
      REQUIRED: false
      comment: Properties of the row.
  TableRowProperties:
    - name: minRowHeight
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: Minimum height of the row. The row will be rendered in the Slides editor at a height equal to or greater than this value in order to show all the text in the row's cell(s).
  TextContent:
    - name: lists
      TYPE: map[STRING]ANY
      REQUIRED: false
      comment: The bulleted lists contained in this text, keyed by list ID.
    - name: textElements
      TYPE: "[]STRUCT(TextElement)"
      REQUIRED: false
      comment: The text contents broken down into its component parts, including styling information. This property is read-only.
  TextElement:
    - name: autoText
      TYPE: STRUCT(AutoText)
      REQUIRED: false
      comment: A TextElement representing a spot in the text that is dynamically replaced with content that can change over time.
    - name: endIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The zero-based end index of this text element, exclusive, in Unicode code units.
    - name: paragraphMarker
      TYPE: STRUCT(ParagraphMarker)
      REQUIRED: false
      comment: A marker representing the beginning of a new paragraph. The `start_index` and `end_index` of this TextElement represent the range of the paragraph. Other TextElements with an index range contained inside this paragraph's range are considered to be part of this paragraph. The range of indices of two separate paragraphs will never overlap.
    - name: startIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The zero-based start index of this text element, in Unicode code units.
    - name: textRun
      TYPE: STRUCT(TextRun)
      REQUIRED: false
      comment: A TextElement representing a run of text where all of the characters in the run have the same TextStyle. The `start_index` and `end_index` of TextRuns will always be fully contained in the index range of a single `paragraph_marker` TextElement. In other words, a TextRun will never span multiple paragraphs.
  TextRun:
    - name: content
      TYPE: STRING
      REQUIRED: false
      comment: The text of this run.
    - name: style
      TYPE: STRUCT(TextStyle)
      REQUIRED: false
      comment: The styling applied to this run.
  TextStyle:
    - name: backgroundColor
      TYPE: STRUCT(OptionalColor)
      REQUIRED: false
      comment: The background color of the text. If set, the color is either opaque or transparent, depending on if the `opaque_color` field in it is set.
    - name: baselineOffset
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - BASELINE_OFFSET_UNSPECIFIED
        - NONE
        - SUPERSCRIPT
        - SUBSCRIPT
      comment: The text's vertical offset from its normal position. Text with `SUPERSCRIPT` or `SUBSCRIPT` baseline offsets is automatically rendered in a smaller font size, computed based on the `font_size` field. The `font_size` itself is not affected by changes in this field.
    - name: bold
      TYPE: BOOL
      REQUIRED: false
      comment: Whether or not the text is rendered as bold.
    - name: fontFamily
      TYPE: STRING
      REQUIRED: false
      comment: The font family of the text. The font family can be any font from the Font menu in Slides or from [Google Fonts] (https://fonts.google.com/). If the font name is unrecognized, the text is rendered in `Arial`. Some fonts can affect the weight of the text. If an update request specifies values for both `font_family` and `bold`, the explicitly-set `bold` value is used.
    - name: fontSize
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: The size of the text's font. When read, the `font_size` will specified in points.
    - name: foregroundColor
      TYPE: STRUCT(OptionalColor)
      REQUIRED: false
      comment: The color of the text itself. If set, the color is either opaque or transparent, depending on if the `opaque_color` field in it is set.
    - name: italic
      TYPE: BOOL
      REQUIRED: false
      comment: Whether or not the text is italicized.
    - name: link
      TYPE: STRUCT(Link)
      REQUIRED: false
      comment: "The hyperlink destination of the text. If unset, there is no link. Links are not inherited from parent text. Changing the link in an update request causes some other changes to the text style of the range: * When setting a link, the text foreground color will be set to ThemeColorType.HYPERLINK and the text will be underlined. If these fields are modified in the same request, those values will be used instead of the link defaults. * Setting a link on a text range that overlaps with an existing link will also update the existing link to point to the new URL. * Links are not settable on newline characters. As a result, setting a link on a text range that crosses a paragraph boundary, such as `\"ABC\\n123\"`, will separate the newline character(s) into their own text runs. The link will be applied separately to the runs before and after the newline. * Removing a link will update the text style of the range to match the style of the preceding text (or the default text styles if the preceding text is another link) unless different styles are being set in the same request."
    - name: smallCaps
      TYPE: BOOL
      REQUIRED: false
      comment: Whether or not the text is in small capital letters.
    - name: strikethrough
      TYPE: BOOL
      REQUIRED: false
      comment: Whether or not the text is struck through.
    - name: underline
      TYPE: BOOL
      REQUIRED: false
      comment: Whether or not the text is underlined.
    - name: weightedFontFamily
      TYPE: STRUCT(WeightedFontFamily)
      REQUIRED: false
      comment: "The font family and rendered weight of the text. This field is an extension of `font_family` meant to support explicit font weights without breaking backwards compatibility. As such, when reading the style of a range of text, the value of `weighted_font_family#font_family` will always be equal to that of `font_family`. However, when writing, if both fields are included in the field mask (either explicitly or through the wildcard `\"*\"`), their values are reconciled as follows: * If `font_family` is set and `weighted_font_family` is not, the value of `font_family` is applied with weight `400` (\"normal\"). * If both fields are set, the value of `font_family` must match that of `weighted_font_family#font_family`. If so, the font family and weight of `weighted_font_family` is applied. Otherwise, a 400 bad request error is returned. * If `weighted_font_family` is set and `font_family` is not, the font family and weight of `weighted_font_family` is applied. * If neither field is set, the font family and weight of the text inherit from the parent. Note that these properties cannot inherit separately from each other. If an update request specifies values for both `weighted_font_family` and `bold`, the `weighted_font_family` is applied first, then `bold`. If `weighted_font_family#weight` is not set, it defaults to `400`. If `weighted_font_family` is set, then `weighted_font_family#font_family` must also be set with a non-empty value. Otherwise, a 400 bad request error is returned."
  ThemeColorPair:
    - name: color
      TYPE: STRUCT(RgbColor)
      REQUIRED: false
      comment: The concrete color corresponding to the theme color type above.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - THEME_COLOR_TYPE_UNSPECIFIED
        - DARK1
        - LIGHT1
        - DARK2
        - LIGHT2
        - ACCENT1
        - ACCENT2
        - ACCENT3
        - ACCENT4
        - ACCENT5
        - ACCENT6
        - HYPERLINK
        - FOLLOWED_HYPERLINK
        - TEXT1
        - BACKGROUND1
        - TEXT2
        - BACKGROUND2
      comment: The type of the theme color.
  Thumbnail:
    - name: contentUrl
      TYPE: STRING
      REQUIRED: false
      comment: The content URL of the thumbnail image. The URL to the image has a default lifetime of 30 minutes. This URL is tagged with the account of the requester. Anyone with the URL effectively accesses the image as the original requester. Access to the image may be lost if the presentation's sharing settings change. The mime type of the thumbnail image is the same as specified in the `GetPageThumbnailRequest`.
    - name: height
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The positive height in pixels of the thumbnail image.
    - name: width
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The positive width in pixels of the thumbnail image.
  UngroupObjectsRequest:
    - name: objectIds
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The object IDs of the objects to ungroup. Only groups that are not inside other groups can be ungrouped. All the groups should be on the same page. The group itself is deleted. The visual sizes and positions of all the children are preserved.
  UnmergeTableCellsRequest:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the table.
    - name: tableRange
      TYPE: STRUCT(TableRange)
      REQUIRED: false
      comment: The table range specifying which cells of the table to unmerge. All merged cells in this range will be unmerged, and cells that are already unmerged will not be affected. If the range has no merged cells, the request will do nothing. If there is text in any of the merged cells, the text will remain in the upper-left ("head") cell of the resulting block of unmerged cells.
  UpdateImagePropertiesRequest:
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `imageProperties` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field. For example to update the image outline color, set `fields` to `"outline.outlineFill.solidFill.color"`. To reset a property to its default value, include its field name in the field mask but leave the field itself unset.
    - name: imageProperties
      TYPE: STRUCT(ImageProperties)
      REQUIRED: false
      comment: The image properties to update.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the image the updates are applied to.
  UpdateLineCategoryRequest:
    - name: lineCategory
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - LINE_CATEGORY_UNSPECIFIED
        - STRAIGHT
        - BENT
        - CURVED
      comment: The line category to update to. The exact line type is determined based on the category to update to and how it's routed to connect to other page elements.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the line the update is applied to. Only a line with a category indicating it is a "connector" can be updated. The line may be rerouted after updating its category.
  UpdateLinePropertiesRequest:
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `lineProperties` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field. For example to update the line solid fill color, set `fields` to `"lineFill.solidFill.color"`. To reset a property to its default value, include its field name in the field mask but leave the field itself unset.
    - name: lineProperties
      TYPE: STRUCT(LineProperties)
      REQUIRED: false
      comment: The line properties to update.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the line the update is applied to.
  UpdatePageElementAltTextRequest:
    - name: description
      TYPE: STRING
      REQUIRED: false
      comment: The updated alt text description of the page element. If unset the existing value will be maintained. The description is exposed to screen readers and other accessibility interfaces. Only use human readable values related to the content of the page element.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the page element the updates are applied to.
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: The updated alt text title of the page element. If unset the existing value will be maintained. The title is exposed to screen readers and other accessibility interfaces. Only use human readable values related to the content of the page element.
  UpdatePageElementTransformRequest:
    - name: applyMode
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - APPLY_MODE_UNSPECIFIED
        - RELATIVE
        - ABSOLUTE
      comment: The apply mode of the transform update.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the page element to update.
    - name: transform
      TYPE: STRUCT(AffineTransform)
      REQUIRED: false
      comment: The input transform matrix used to update the page element.
  UpdatePageElementsZOrderRequest:
    - name: operation
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - Z_ORDER_OPERATION_UNSPECIFIED
        - BRING_TO_FRONT
        - BRING_FORWARD
        - SEND_BACKWARD
        - SEND_TO_BACK
      comment: The Z-order operation to apply on the page elements. When applying the operation on multiple page elements, the relative Z-orders within these page elements before the operation is maintained.
    - name: pageElementObjectIds
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The object IDs of the page elements to update. All the page elements must be on the same page and must not be grouped.
  UpdatePagePropertiesRequest:
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `pageProperties` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field. For example to update the page background solid fill color, set `fields` to `"pageBackgroundFill.solidFill.color"`. To reset a property to its default value, include its field name in the field mask but leave the field itself unset.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the page the update is applied to.
    - name: pageProperties
      TYPE: STRUCT(PageProperties)
      REQUIRED: false
      comment: The page properties to update.
  UpdateParagraphStyleRequest:
    - name: cellLocation
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The location of the cell in the table containing the paragraph(s) to style. If `object_id` refers to a table, `cell_location` must have a value. Otherwise, it must not.
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `style` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field. For example, to update the paragraph alignment, set `fields` to `"alignment"`. To reset a property to its default value, include its field name in the field mask but leave the field itself unset.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the shape or table with the text to be styled.
    - name: style
      TYPE: STRUCT(ParagraphStyle)
      REQUIRED: false
      comment: The paragraph's style.
    - name: textRange
      TYPE: STRUCT(Range)
      REQUIRED: false
      comment: The range of text containing the paragraph(s) to style.
  UpdateShapePropertiesRequest:
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `shapeProperties` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field. For example to update the shape background solid fill color, set `fields` to `"shapeBackgroundFill.solidFill.color"`. To reset a property to its default value, include its field name in the field mask but leave the field itself unset.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the shape the updates are applied to.
    - name: shapeProperties
      TYPE: STRUCT(ShapeProperties)
      REQUIRED: false
      comment: The shape properties to update.
  UpdateSlidePropertiesRequest:
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root 'slideProperties' is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field. For example to update whether a slide is skipped, set `fields` to `"isSkipped"`. To reset a property to its default value, include its field name in the field mask but leave the field itself unset.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the slide the update is applied to.
    - name: slideProperties
      TYPE: STRUCT(SlideProperties)
      REQUIRED: false
      comment: The slide properties to update.
  UpdateSlidesPositionRequest:
    - name: insertionIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The index where the slides should be inserted, based on the slide arrangement before the move takes place. Must be between zero and the number of slides in the presentation, inclusive.
    - name: slideObjectIds
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The IDs of the slides in the presentation that should be moved. The slides in this list must be in existing presentation order, without duplicates.
  UpdateTableBorderPropertiesRequest:
    - name: borderPosition
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ALL
        - BOTTOM
        - INNER
        - INNER_HORIZONTAL
        - INNER_VERTICAL
        - LEFT
        - OUTER
        - RIGHT
        - TOP
      comment: The border position in the table range the updates should apply to. If a border position is not specified, the updates will apply to all borders in the table range.
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `tableBorderProperties` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field. For example to update the table border solid fill color, set `fields` to `"tableBorderFill.solidFill.color"`. To reset a property to its default value, include its field name in the field mask but leave the field itself unset.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the table.
    - name: tableBorderProperties
      TYPE: STRUCT(TableBorderProperties)
      REQUIRED: false
      comment: The table border properties to update.
    - name: tableRange
      TYPE: STRUCT(TableRange)
      REQUIRED: false
      comment: The table range representing the subset of the table to which the updates are applied. If a table range is not specified, the updates will apply to the entire table.
  UpdateTableCellPropertiesRequest:
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `tableCellProperties` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field. For example to update the table cell background solid fill color, set `fields` to `"tableCellBackgroundFill.solidFill.color"`. To reset a property to its default value, include its field name in the field mask but leave the field itself unset.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the table.
    - name: tableCellProperties
      TYPE: STRUCT(TableCellProperties)
      REQUIRED: false
      comment: The table cell properties to update.
    - name: tableRange
      TYPE: STRUCT(TableRange)
      REQUIRED: false
      comment: The table range representing the subset of the table to which the updates are applied. If a table range is not specified, the updates will apply to the entire table.
  UpdateTableColumnPropertiesRequest:
    - name: columnIndices
      TYPE: "[]INT"
      REQUIRED: false
      comment: The list of zero-based indices specifying which columns to update. If no indices are provided, all columns in the table will be updated.
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `tableColumnProperties` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field. For example to update the column width, set `fields` to `"column_width"`. If '"column_width"' is included in the field mask but the property is left unset, the column width will default to 406,400 EMU (32 points).
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the table.
    - name: tableColumnProperties
      TYPE: STRUCT(TableColumnProperties)
      REQUIRED: false
      comment: The table column properties to update. If the value of `table_column_properties#column_width` in the request is less than 406,400 EMU (32 points), a 400 bad request error is returned.
  UpdateTableRowPropertiesRequest:
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `tableRowProperties` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field. For example to update the minimum row height, set `fields` to `"min_row_height"`. If '"min_row_height"' is included in the field mask but the property is left unset, the minimum row height will default to 0.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the table.
    - name: rowIndices
      TYPE: "[]INT"
      REQUIRED: false
      comment: The list of zero-based indices specifying which rows to update. If no indices are provided, all rows in the table will be updated.
    - name: tableRowProperties
      TYPE: STRUCT(TableRowProperties)
      REQUIRED: false
      comment: The table row properties to update.
  UpdateTextStyleRequest:
    - name: cellLocation
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The location of the cell in the table containing the text to style. If `object_id` refers to a table, `cell_location` must have a value. Otherwise, it must not.
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `style` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field. For example, to update the text style to bold, set `fields` to `"bold"`. To reset a property to its default value, include its field name in the field mask but leave the field itself unset.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the shape or table with the text to be styled.
    - name: style
      TYPE: STRUCT(TextStyle)
      REQUIRED: false
      comment: The style(s) to set on the text. If the value for a particular style matches that of the parent, that style will be set to inherit. Certain text style changes may cause other changes meant to mirror the behavior of the Slides editor. See the documentation of TextStyle for more information.
    - name: textRange
      TYPE: STRUCT(Range)
      REQUIRED: false
      comment: The range of text to style. The range may be extended to include adjacent newlines. If the range fully contains a paragraph belonging to a list, the paragraph's bullet is also updated with the matching text style.
  UpdateVideoPropertiesRequest:
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `videoProperties` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field. For example to update the video outline color, set `fields` to `"outline.outlineFill.solidFill.color"`. To reset a property to its default value, include its field name in the field mask but leave the field itself unset.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the video the updates are applied to.
    - name: videoProperties
      TYPE: STRUCT(VideoProperties)
      REQUIRED: false
      comment: The video properties to update.
  Video:
    - name: id
      TYPE: STRING
      REQUIRED: false
      comment: The video source's unique identifier for this video.
    - name: source
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - SOURCE_UNSPECIFIED
        - YOUTUBE
        - DRIVE
      comment: The video source.
    - name: url
      TYPE: STRING
      REQUIRED: false
      comment: An URL to a video. The URL is valid as long as the source video exists and sharing settings do not change.
    - name: videoProperties
      TYPE: STRUCT(VideoProperties)
      REQUIRED: false
      comment: The properties of the video.
  VideoProperties:
    - name: autoPlay
      TYPE: BOOL
      REQUIRED: false
      comment: Whether to enable video autoplay when the page is displayed in present mode. Defaults to false.
    - name: end
      TYPE: INT
      REQUIRED: false
      FORMAT: uint32
      comment: The time at which to end playback, measured in seconds from the beginning of the video. If set, the end time should be after the start time. If not set or if you set this to a value that exceeds the video's length, the video will be played until its end.
    - name: mute
      TYPE: BOOL
      REQUIRED: false
      comment: Whether to mute the audio during video playback. Defaults to false.
    - name: outline
      TYPE: STRUCT(Outline)
      REQUIRED: false
      comment: The outline of the video. The default outline matches the defaults for new videos created in the Slides editor.
    - name: start
      TYPE: INT
      REQUIRED: false
      FORMAT: uint32
      comment: The time at which to start playback, measured in seconds from the beginning of the video. If set, the start time should be before the end time. If you set this to a value that exceeds the video's length in seconds, the video will be played from the last second. If not set, the video will be played from the beginning.
  WeightedFontFamily:
    - name: fontFamily
      TYPE: STRING
      REQUIRED: false
      comment: The font family of the text. The font family can be any font from the Font menu in Slides or from [Google Fonts] (https://fonts.google.com/). If the font name is unrecognized, the text is rendered in `Arial`.
    - name: weight
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The rendered weight of the text. This field can have any value that is a multiple of `100` between `100` and `900`, inclusive. This range corresponds to the numerical values described in the CSS 2.1 Specification, [section 15.6](https://www.w3.org/TR/CSS21/fonts.html#font-boldness), with non-numerical values disallowed. Weights greater than or equal to `700` are considered bold, and weights less than `700`are not bold. The default value is `400` ("normal").
  WordArt:
    - name: renderedText
      TYPE: STRING
      REQUIRED: false
      comment: The text rendered as word art.
  WriteControl:
    - name: requiredRevisionId
      TYPE: STRING
      REQUIRED: false
      comment: The revision ID of the presentation required for the write request. If specified and the required revision ID doesn't match the presentation's current revision ID, the request is not processed and returns a 400 bad request error. When a required revision ID is returned in a response, it indicates the revision ID of the document after the request was applied.
