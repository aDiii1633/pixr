        - FLOW_CHART_PROCESS
        - FLOW_CHART_PUNCHED_CARD
        - FLOW_CHART_PUNCHED_TAPE
        - FLOW_CHART_SORT
        - FLOW_CHART_SUMMING_JUNCTION
        - FLOW_CHART_TERMINATOR
        - ARROW_EAST
        - ARROW_NORTH_EAST
        - ARROW_NORTH
        - SPEECH
        - STARBURST
        - TEARDROP
        - ELLIPSE_RIBBON
        - ELLIPSE_RIBBON_2
        - CLOUD_CALLOUT
        - CUSTOM
      comment: The shape type.
  CreateShapeResponse:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the created shape.
  CreateSheetsChartRequest:
    - name: chartId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the specific chart in the Google Sheets spreadsheet.
    - name: elementProperties
      TYPE: STRUCT(PageElementProperties)
      REQUIRED: false
      comment: The element properties for the chart. When the aspect ratio of the provided size does not match the chart aspect ratio, the chart is scaled and centered with respect to the size in order to maintain aspect ratio. The provided transform is applied after this operation.
    - name: linkingMode
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - NOT_LINKED_IMAGE
        - LINKED
      comment: The mode with which the chart is linked to the source spreadsheet. When not specified, the chart will be an image that is not linked.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: A user-supplied object ID. If specified, the ID must be unique among all pages and page elements in the presentation. The ID should start with a word character [a-zA-Z0-9_] and then followed by any number of the following characters [a-zA-Z0-9_-:]. The length of the ID should not be less than 5 or greater than 50. If empty, a unique identifier will be generated.
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the Google Sheets spreadsheet that contains the chart. You might need to add a resource key to the HTTP header for a subset of old files. For more information, see [Access link-shared files using resource keys](https://developers.google.com/drive/api/v3/resource-keys).
  CreateSheetsChartResponse:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the created chart.
  CreateSlideRequest:
    - name: insertionIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The optional zero-based index indicating where to insert the slides. If you don't specify an index, the slide is created at the end.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: A user-supplied object ID. If you specify an ID, it must be unique among all pages and page elements in the presentation. The ID must start with an alphanumeric character or an underscore (matches regex `[a-zA-Z0-9_]`); remaining characters may include those as well as a hyphen or colon (matches regex `[a-zA-Z0-9_-:]`). The ID length must be between 5 and 50 characters, inclusive. If you don't specify an ID, a unique one is generated.
    - name: placeholderIdMappings
      TYPE: "[]STRUCT(LayoutPlaceholderIdMapping)"
      REQUIRED: false
      comment: An optional list of object ID mappings from the placeholder(s) on the layout to the placeholders that are created on the slide from the specified layout. Can only be used when `slide_layout_reference` is specified.
    - name: slideLayoutReference
      TYPE: STRUCT(LayoutReference)
      REQUIRED: false
      comment: "Layout reference of the slide to be inserted, based on the *current master*, which is one of the following: - The master of the previous slide index. - The master of the first slide, if the insertion_index is zero. - The first master in the presentation, if there are no slides. If the LayoutReference is not found in the current master, a 400 bad request error is returned. If you don't specify a layout reference, the slide uses the predefined `BLANK` layout."
  CreateSlideResponse:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the created slide.
  CreateTableRequest:
    - name: columns
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Number of columns in the table.
    - name: elementProperties
      TYPE: STRUCT(PageElementProperties)
      REQUIRED: false
      comment: The element properties for the table. The table will be created at the provided size, subject to a minimum size. If no size is provided, the table will be automatically sized. Table transforms must have a scale of 1 and no shear components. If no transform is provided, the table will be centered on the page.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: A user-supplied object ID. If you specify an ID, it must be unique among all pages and page elements in the presentation. The ID must start with an alphanumeric character or an underscore (matches regex `[a-zA-Z0-9_]`); remaining characters may include those as well as a hyphen or colon (matches regex `[a-zA-Z0-9_-:]`). The length of the ID must not be less than 5 or greater than 50. If you don't specify an ID, a unique one is generated.
    - name: rows
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Number of rows in the table.
  CreateTableResponse:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the created table.
  CreateVideoRequest:
    - name: elementProperties
      TYPE: STRUCT(PageElementProperties)
      REQUIRED: false
      comment: The element properties for the video. The PageElementProperties.size property is optional. If you don't specify a size, a default size is chosen by the server. The PageElementProperties.transform property is optional. The transform must not have shear components. If you don't specify a transform, the video will be placed at the top left corner of the page.
    - name: id
      TYPE: STRING
      REQUIRED: false
      comment: The video source's unique identifier for this video. e.g. For YouTube video https://www.youtube.com/watch?v=7U3axjORYZ0, the ID is 7U3axjORYZ0. For a Google Drive video https://drive.google.com/file/d/1xCgQLFTJi5_Xl8DgW_lcUYq5e-q6Hi5Q the ID is 1xCgQLFTJi5_Xl8DgW_lcUYq5e-q6Hi5Q. To access a Google Drive video file, you might need to add a resource key to the HTTP header for a subset of old files. For more information, see [Access link-shared files using resource keys](https://developers.google.com/drive/api/v3/resource-keys).
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: A user-supplied object ID. If you specify an ID, it must be unique among all pages and page elements in the presentation. The ID must start with an alphanumeric character or an underscore (matches regex `[a-zA-Z0-9_]`); remaining characters may include those as well as a hyphen or colon (matches regex `[a-zA-Z0-9_-:]`). The length of the ID must not be less than 5 or greater than 50. If you don't specify an ID, a unique one is generated.
    - name: source
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - SOURCE_UNSPECIFIED
        - YOUTUBE
        - DRIVE
      comment: The video source.
  CreateVideoResponse:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the created video.
  CropProperties:
    - name: angle
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The rotation angle of the crop window around its center, in radians. Rotation angle is applied after the offset.
    - name: bottomOffset
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The offset specifies the bottom edge of the crop rectangle that is located above the original bounding rectangle bottom edge, relative to the object's original height.
    - name: leftOffset
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The offset specifies the left edge of the crop rectangle that is located to the right of the original bounding rectangle left edge, relative to the object's original width.
    - name: rightOffset
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The offset specifies the right edge of the crop rectangle that is located to the left of the original bounding rectangle right edge, relative to the object's original width.
    - name: topOffset
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The offset specifies the top edge of the crop rectangle that is located below the original bounding rectangle top edge, relative to the object's original height.
  DeleteObjectRequest:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the page or page element to delete. If after a delete operation a group contains only 1 or no page elements, the group is also deleted. If a placeholder is deleted on a layout, any empty inheriting placeholders are also deleted.
  DeleteParagraphBulletsRequest:
    - name: cellLocation
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The optional table cell location if the text to be modified is in a table cell. If present, the object_id must refer to a table.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the shape or table containing the text to delete bullets from.
    - name: textRange
      TYPE: STRUCT(Range)
      REQUIRED: false
      comment: The range of text to delete bullets from, based on TextElement indexes.
  DeleteTableColumnRequest:
    - name: cellLocation
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The reference table cell location from which a column will be deleted. The column this cell spans will be deleted. If this is a merged cell, multiple columns will be deleted. If no columns remain in the table after this deletion, the whole table is deleted.
    - name: tableObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The table to delete columns from.
  DeleteTableRowRequest:
    - name: cellLocation
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The reference table cell location from which a row will be deleted. The row this cell spans will be deleted. If this is a merged cell, multiple rows will be deleted. If no rows remain in the table after this deletion, the whole table is deleted.
    - name: tableObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The table to delete rows from.
  DeleteTextRequest:
    - name: cellLocation
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The optional table cell location if the text is to be deleted from a table cell. If present, the object_id must refer to a table.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the shape or table from which the text will be deleted.
    - name: textRange
      TYPE: STRUCT(Range)
      REQUIRED: false
      comment: The range of text to delete, based on TextElement indexes. There is always an implicit newline character at the end of a shape's or table cell's text that cannot be deleted. `Range.Type.ALL` will use the correct bounds, but care must be taken when specifying explicit bounds for range types `FROM_START_INDEX` and `FIXED_RANGE`. For example, if the text is "ABC", followed by an implicit newline, then the maximum value is 2 for `text_range.start_index` and 3 for `text_range.end_index`. Deleting text that crosses a paragraph boundary may result in changes to paragraph styles and lists as the two paragraphs are merged. Ranges that include only one code unit of a surrogate pair are expanded to include both code units.
  Dimension:
    - name: magnitude
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The magnitude.
    - name: unit
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - UNIT_UNSPECIFIED
        - EMU
        - PT
      comment: The units for magnitude.
  DuplicateObjectRequest:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the object to duplicate.
    - name: objectIds
      TYPE: map[STRING]STRING
      REQUIRED: false
      comment: "The object being duplicated may contain other objects, for example when duplicating a slide or a group page element. This map defines how the IDs of duplicated objects are generated: the keys are the IDs of the original objects and its values are the IDs that will be assigned to the corresponding duplicate object. The ID of the source object's duplicate may be specified in this map as well, using the same value of the `object_id` field as a key and the newly desired ID as the value. All keys must correspond to existing IDs in the presentation. All values must be unique in the presentation and must start with an alphanumeric character or an underscore (matches regex `[a-zA-Z0-9_]`); remaining characters may include those as well as a hyphen or colon (matches regex `[a-zA-Z0-9_-:]`). The length of the new ID must not be less than 5 or greater than 50. If any IDs of source objects are omitted from the map, a new random ID will be assigned. If the map is empty or unset, all duplicate objects will receive a new random ID."
  DuplicateObjectResponse:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the new duplicate object.
  Group:
    - name: children
      TYPE: "[]STRUCT(PageElement)"
      REQUIRED: false
      comment: The collection of elements in the group. The minimum size of a group is 2.
  GroupObjectsRequest:
    - name: childrenObjectIds
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The object IDs of the objects to group. Only page elements can be grouped. There should be at least two page elements on the same page that are not already in another group. Some page elements, such as videos, tables and placeholders cannot be grouped.
    - name: groupObjectId
      TYPE: STRING
      REQUIRED: false
      comment: A user-supplied object ID for the group to be created. If you specify an ID, it must be unique among all pages and page elements in the presentation. The ID must start with an alphanumeric character or an underscore (matches regex `[a-zA-Z0-9_]`); remaining characters may include those as well as a hyphen or colon (matches regex `[a-zA-Z0-9_-:]`). The length of the ID must not be less than 5 or greater than 50. If you don't specify an ID, a unique one is generated.
  GroupObjectsResponse:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the created group.
  Image:
    - name: contentUrl
      TYPE: STRING
      REQUIRED: false
      comment: An URL to an image with a default lifetime of 30 minutes. This URL is tagged with the account of the requester. Anyone with the URL effectively accesses the image as the original requester. Access to the image may be lost if the presentation's sharing settings change.
    - name: imageProperties
      TYPE: STRUCT(ImageProperties)
      REQUIRED: false
      comment: The properties of the image.
    - name: placeholder
      TYPE: STRUCT(Placeholder)
      REQUIRED: false
      comment: Placeholders are page elements that inherit from corresponding placeholders on layouts and masters. If set, the image is a placeholder image and any inherited properties can be resolved by looking at the parent placeholder identified by the Placeholder.parent_object_id field.
    - name: sourceUrl
      TYPE: STRING
      REQUIRED: false
      comment: The source URL is the URL used to insert the image. The source URL can be empty.
  ImageProperties:
    - name: brightness
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The brightness effect of the image. The value should be in the interval [-1.0, 1.0], where 0 means no effect. This property is read-only.
    - name: contrast
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The contrast effect of the image. The value should be in the interval [-1.0, 1.0], where 0 means no effect. This property is read-only.
    - name: cropProperties
      TYPE: STRUCT(CropProperties)
      REQUIRED: false
      comment: The crop properties of the image. If not set, the image is not cropped. This property is read-only.
    - name: link
      TYPE: STRUCT(Link)
      REQUIRED: false
      comment: The hyperlink destination of the image. If unset, there is no link.
    - name: outline
      TYPE: STRUCT(Outline)
      REQUIRED: false
      comment: The outline of the image. If not set, the image has no outline.
    - name: recolor
      TYPE: STRUCT(Recolor)
      REQUIRED: false
      comment: The recolor effect of the image. If not set, the image is not recolored. This property is read-only.
    - name: shadow
      TYPE: STRUCT(Shadow)
      REQUIRED: false
      comment: The shadow of the image. If not set, the image has no shadow. This property is read-only.
    - name: transparency
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The transparency effect of the image. The value should be in the interval [0.0, 1.0], where 0 means no effect and 1 means completely transparent. This property is read-only.
  InsertTableColumnsRequest:
    - name: cellLocation
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The reference table cell location from which columns will be inserted. A new column will be inserted to the left (or right) of the column where the reference cell is. If the reference cell is a merged cell, a new column will be inserted to the left (or right) of the merged cell.
    - name: insertRight
      TYPE: BOOL
      REQUIRED: false
      comment: "Whether to insert new columns to the right of the reference cell location. - `True`: insert to the right. - `False`: insert to the left."
    - name: number
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of columns to be inserted. Maximum 20 per request.
    - name: tableObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The table to insert columns into.
  InsertTableRowsRequest:
    - name: cellLocation
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The reference table cell location from which rows will be inserted. A new row will be inserted above (or below) the row where the reference cell is. If the reference cell is a merged cell, a new row will be inserted above (or below) the merged cell.
    - name: insertBelow
      TYPE: BOOL
      REQUIRED: false
      comment: "Whether to insert new rows below the reference cell location. - `True`: insert below the cell. - `False`: insert above the cell."
    - name: number
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of rows to be inserted. Maximum 20 per request.
    - name: tableObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The table to insert rows into.
  InsertTextRequest:
    - name: cellLocation
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The optional table cell location if the text is to be inserted into a table cell. If present, the object_id must refer to a table.
    - name: insertionIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The index where the text will be inserted, in Unicode code units, based on TextElement indexes. The index is zero-based and is computed from the start of the string. The index may be adjusted to prevent insertions inside Unicode grapheme clusters. In these cases, the text will be inserted immediately after the grapheme cluster.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the shape or table where the text will be inserted.
    - name: text
      TYPE: STRING
      REQUIRED: false
      comment: The text to be inserted. Inserting a newline character will implicitly create a new ParagraphMarker at that index. The paragraph style of the new paragraph will be copied from the paragraph at the current insertion index, including lists and bullets. Text styles for inserted text will be determined automatically, generally preserving the styling of neighboring text. In most cases, the text will be added to the TextRun that exists at the insertion index. Some control characters (U+0000-U+0008, U+000C-U+001F) and characters from the Unicode Basic Multilingual Plane Private Use Area (U+E000-U+F8FF) will be stripped out of the inserted text.
  LayoutPlaceholderIdMapping:
    - name: layoutPlaceholder
      TYPE: STRUCT(Placeholder)
      REQUIRED: false
      comment: The placeholder on a layout that will be applied to a slide. Only type and index are needed. For example, a predefined `TITLE_AND_BODY` layout may usually have a TITLE placeholder with index 0 and a BODY placeholder with index 0.
    - name: layoutPlaceholderObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the placeholder on a layout that will be applied to a slide.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: A user-supplied object ID for the placeholder identified above that to be created onto a slide. If you specify an ID, it must be unique among all pages and page elements in the presentation. The ID must start with an alphanumeric character or an underscore (matches regex `[a-zA-Z0-9_]`); remaining characters may include those as well as a hyphen or colon (matches regex `[a-zA-Z0-9_-:]`). The length of the ID must not be less than 5 or greater than 50. If you don't specify an ID, a unique one is generated.
  LayoutProperties:
    - name: displayName
      TYPE: STRING
      REQUIRED: false
      comment: The human-readable name of the layout.
    - name: masterObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the master that this layout is based on.
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: The name of the layout.
  LayoutReference:
    - name: layoutId
      TYPE: STRING
      REQUIRED: false
      comment: "Layout ID: the object ID of one of the layouts in the presentation."
    - name: predefinedLayout
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - PREDEFINED_LAYOUT_UNSPECIFIED
        - BLANK
        - CAPTION_ONLY
        - TITLE
        - TITLE_AND_BODY
        - TITLE_AND_TWO_COLUMNS
        - TITLE_ONLY
        - SECTION_HEADER
        - SECTION_TITLE_AND_DESCRIPTION
        - ONE_COLUMN_TEXT
        - MAIN_POINT
        - BIG_NUMBER
      comment: Predefined layout.
  Line:
    - name: lineCategory
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - LINE_CATEGORY_UNSPECIFIED
        - STRAIGHT
        - BENT
        - CURVED
      comment: The category of the line. It matches the `category` specified in CreateLineRequest, and can be updated with UpdateLineCategoryRequest.
    - name: lineProperties
      TYPE: STRUCT(LineProperties)
      REQUIRED: false
      comment: The properties of the line.
    - name: lineType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - TYPE_UNSPECIFIED
        - STRAIGHT_CONNECTOR_1
        - BENT_CONNECTOR_2
        - BENT_CONNECTOR_3
        - BENT_CONNECTOR_4
        - BENT_CONNECTOR_5
        - CURVED_CONNECTOR_2
        - CURVED_CONNECTOR_3
        - CURVED_CONNECTOR_4
        - CURVED_CONNECTOR_5
        - STRAIGHT_LINE
      comment: The type of the line.
  LineConnection:
    - name: connectedObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the connected page element. Some page elements, such as groups, tables, and lines do not have connection sites and therefore cannot be connected to a connector line.
    - name: connectionSiteIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The index of the connection site on the connected page element. In most cases, it corresponds to the predefined connection site index from the ECMA-376 standard. More information on those connection sites can be found in both the description of the "cxn" attribute in section 20.1.9.9 and "Annex H. Example Predefined DrawingML Shape and Text Geometries" of "Office Open XML File Formats - Fundamentals and Markup Language Reference", part 1 of [ECMA-376 5th edition](https://ecma-international.org/publications-and-standards/standards/ecma-376/). The position of each connection site can also be viewed from Slides editor.
  LineFill:
    - name: solidFill
      TYPE: STRUCT(SolidFill)
      REQUIRED: false
      comment: Solid color fill.
  LineProperties:
    - name: dashStyle
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DASH_STYLE_UNSPECIFIED
        - SOLID
        - DOT
        - DASH
        - DASH_DOT
        - LONG_DASH
        - LONG_DASH_DOT
      comment: The dash style of the line.
    - name: endArrow
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ARROW_STYLE_UNSPECIFIED
        - NONE
        - STEALTH_ARROW
        - FILL_ARROW
        - FILL_CIRCLE
        - FILL_SQUARE
        - FILL_DIAMOND
        - OPEN_ARROW
        - OPEN_CIRCLE
        - OPEN_SQUARE
        - OPEN_DIAMOND
      comment: The style of the arrow at the end of the line.
    - name: endConnection
      TYPE: STRUCT(LineConnection)
      REQUIRED: false
      comment: The connection at the end of the line. If unset, there is no connection. Only lines with a Type indicating it is a "connector" can have an `end_connection`.
    - name: lineFill
      TYPE: STRUCT(LineFill)
      REQUIRED: false
      comment: The fill of the line. The default line fill matches the defaults for new lines created in the Slides editor.
    - name: link
      TYPE: STRUCT(Link)
      REQUIRED: false
      comment: The hyperlink destination of the line. If unset, there is no link.
    - name: startArrow
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ARROW_STYLE_UNSPECIFIED
        - NONE
        - STEALTH_ARROW
        - FILL_ARROW
        - FILL_CIRCLE
        - FILL_SQUARE
        - FILL_DIAMOND
        - OPEN_ARROW
        - OPEN_CIRCLE
        - OPEN_SQUARE
        - OPEN_DIAMOND
      comment: The style of the arrow at the beginning of the line.
    - name: startConnection
      TYPE: STRUCT(LineConnection)
      REQUIRED: false
      comment: The connection at the beginning of the line. If unset, there is no connection. Only lines with a Type indicating it is a "connector" can have a `start_connection`.
    - name: weight
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: The thickness of the line.
  Link:
    - name: pageObjectId
      TYPE: STRING
      REQUIRED: false
      comment: If set, indicates this is a link to the specific page in this presentation with this ID. A page with this ID may not exist.
    - name: relativeLink
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RELATIVE_SLIDE_LINK_UNSPECIFIED
        - NEXT_SLIDE
        - PREVIOUS_SLIDE
        - FIRST_SLIDE
        - LAST_SLIDE
      comment: If set, indicates this is a link to a slide in this presentation, addressed by its position.
    - name: slideIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: If set, indicates this is a link to the slide at this zero-based index in the presentation. There may not be a slide at this index.
    - name: url
      TYPE: STRING
      REQUIRED: false
      comment: If set, indicates this is a link to the external web page at this URL.
  MasterProperties:
    - name: displayName
      TYPE: STRING
      REQUIRED: false
      comment: The human-readable name of the master.
  MergeTableCellsRequest:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the table.
    - name: tableRange
      TYPE: STRUCT(TableRange)
      REQUIRED: false
      comment: The table range specifying which cells of the table to merge. Any text in the cells being merged will be concatenated and stored in the upper-left ("head") cell of the range. If the range is non-rectangular (which can occur in some cases where the range covers cells that are already merged), a 400 bad request error is returned.
  NotesProperties:
    - name: speakerNotesObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the shape on this notes page that contains the speaker notes for the corresponding slide. The actual shape may not always exist on the notes page. Inserting text using this object ID will automatically create the shape. In this case, the actual shape may have different object ID. The `GetPresentation` or `GetPage` action will always return the latest object ID.
  OpaqueColor:
    - name: rgbColor
      TYPE: STRUCT(RgbColor)
      REQUIRED: false
      comment: An opaque RGB color.
    - name: themeColor
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - THEME_COLOR_TYPE_UNSPECIFIED
        - DARK1
        - LIGHT1
        - DARK2
        - LIGHT2
        - ACCENT1
        - ACCENT2
        - ACCENT3
        - ACCENT4
        - ACCENT5
        - ACCENT6
        - HYPERLINK
        - FOLLOWED_HYPERLINK
        - TEXT1
        - BACKGROUND1
        - TEXT2
        - BACKGROUND2
      comment: An opaque theme color.
  OptionalColor:
    - name: opaqueColor
      TYPE: STRUCT(OpaqueColor)
      REQUIRED: false
      comment: If set, this will be used as an opaque color. If unset, this represents a transparent color.
  Outline:
    - name: dashStyle
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DASH_STYLE_UNSPECIFIED
        - SOLID
        - DOT
        - DASH
        - DASH_DOT
        - LONG_DASH
        - LONG_DASH_DOT
      comment: The dash style of the outline.
    - name: outlineFill
      TYPE: STRUCT(OutlineFill)
      REQUIRED: false
      comment: The fill of the outline.
    - name: propertyState
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RENDERED
        - NOT_RENDERED
        - INHERIT
      comment: The outline property state. Updating the outline on a page element will implicitly update this field to `RENDERED`, unless another value is specified in the same request. To have no outline on a page element, set this field to `NOT_RENDERED`. In this case, any other outline fields set in the same request will be ignored.
    - name: weight
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: The thickness of the outline.
  OutlineFill:
    - name: solidFill
      TYPE: STRUCT(SolidFill)
      REQUIRED: false
      comment: Solid color fill.
  Page:
    - name: layoutProperties
      TYPE: STRUCT(LayoutProperties)
      REQUIRED: false
      comment: Layout specific properties. Only set if page_type = LAYOUT.
    - name: masterProperties
      TYPE: STRUCT(MasterProperties)
      REQUIRED: false
      comment: Master specific properties. Only set if page_type = MASTER.
    - name: notesProperties
      TYPE: STRUCT(NotesProperties)
      REQUIRED: false
      comment: Notes specific properties. Only set if page_type = NOTES.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID for this page. Object IDs used by Page and PageElement share the same namespace.
    - name: pageElements
      TYPE: "[]STRUCT(PageElement)"
      REQUIRED: false
      comment: The page elements rendered on the page.
    - name: pageProperties
      TYPE: STRUCT(PageProperties)
      REQUIRED: false
      comment: The properties of the page.
    - name: pageType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - SLIDE
        - MASTER
        - LAYOUT
        - NOTES
        - NOTES_MASTER
      comment: The type of the page.
    - name: revisionId
      TYPE: STRING
      REQUIRED: false
      comment: Output only. The revision ID of the presentation. Can be used in update requests to assert the presentation revision hasn't changed since the last read operation. Only populated if the user has edit access to the presentation. The revision ID is not a sequential number but an opaque string. The format of the revision ID might change over time. A returned revision ID is only guaranteed to be valid for 24 hours after it has been returned and cannot be shared across users. If the revision ID is unchanged between calls, then the presentation has not changed. Conversely, a changed ID (for the same presentation and user) usually means the presentation has been updated. However, a changed ID can also be due to internal factors such as ID format changes.
    - name: slideProperties
      TYPE: STRUCT(SlideProperties)
      REQUIRED: false
      comment: Slide specific properties. Only set if page_type = SLIDE.
  PageBackgroundFill:
    - name: propertyState
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RENDERED
        - NOT_RENDERED
        - INHERIT
      comment: The background fill property state. Updating the fill on a page will implicitly update this field to `RENDERED`, unless another value is specified in the same request. To have no fill on a page, set this field to `NOT_RENDERED`. In this case, any other fill fields set in the same request will be ignored.
    - name: solidFill
      TYPE: STRUCT(SolidFill)
      REQUIRED: false
      comment: Solid color fill.
    - name: stretchedPictureFill
      TYPE: STRUCT(StretchedPictureFill)
      REQUIRED: false
      comment: Stretched picture fill.
  PageElement:
    - name: description
      TYPE: STRING
      REQUIRED: false
      comment: The description of the page element. Combined with title to display alt text. The field is not supported for Group elements.
    - name: elementGroup
      TYPE: STRUCT(Group)
      REQUIRED: false
      comment: A collection of page elements joined as a single unit.
    - name: image
      TYPE: STRUCT(Image)
      REQUIRED: false
      comment: An image page element.
    - name: line
      TYPE: STRUCT(Line)
      REQUIRED: false
      comment: A line page element.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID for this page element. Object IDs used by google.apps.slides.v1.Page and google.apps.slides.v1.PageElement share the same namespace.
    - name: shape
      TYPE: STRUCT(Shape)
      REQUIRED: false
      comment: A generic shape.
    - name: sheetsChart
      TYPE: STRUCT(SheetsChart)
      REQUIRED: false
      comment: A linked chart embedded from Google Sheets. Unlinked charts are represented as images.
    - name: size
      TYPE: STRUCT(Size)
      REQUIRED: false
      comment: The size of the page element.
    - name: speakerSpotlight
      TYPE: STRUCT(SpeakerSpotlight)
      REQUIRED: false
      comment: A Speaker Spotlight.
    - name: table
      TYPE: STRUCT(Table)
      REQUIRED: false
      comment: A table page element.
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: The title of the page element. Combined with description to display alt text. The field is not supported for Group elements.
    - name: transform
      TYPE: STRUCT(AffineTransform)
      REQUIRED: false
      comment: The transform of the page element. The visual appearance of the page element is determined by its absolute transform. To compute the absolute transform, preconcatenate a page element's transform with the transforms of all of its parent groups. If the page element is not in a group, its absolute transform is the same as the value in this field. The initial transform for the newly created Group is always the identity transform.
    - name: video
      TYPE: STRUCT(Video)
      REQUIRED: false
      comment: A video page element.
    - name: wordArt
      TYPE: STRUCT(WordArt)
      REQUIRED: false
      comment: A word art page element.
  PageElementProperties:
    - name: pageObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the page where the element is located.
    - name: size
      TYPE: STRUCT(Size)
      REQUIRED: false
      comment: The size of the element.
    - name: transform
      TYPE: STRUCT(AffineTransform)
      REQUIRED: false
      comment: The transform for the element.
  PageProperties:
    - name: colorScheme
      TYPE: STRUCT(ColorScheme)
      REQUIRED: false
      comment: The color scheme of the page. If unset, the color scheme is inherited from a parent page. If the page has no parent, the color scheme uses a default Slides color scheme, matching the defaults in the Slides editor. Only the concrete colors of the first 12 ThemeColorTypes are editable. In addition, only the color scheme on `Master` pages can be updated. To update the field, a color scheme containing mappings from all the first 12 ThemeColorTypes to their concrete colors must be provided. Colors for the remaining ThemeColorTypes will be ignored.
    - name: pageBackgroundFill
      TYPE: STRUCT(PageBackgroundFill)
      REQUIRED: false
      comment: The background fill of the page. If unset, the background fill is inherited from a parent page if it exists. If the page has no parent, then the background fill defaults to the corresponding fill in the Slides editor.
  ParagraphMarker:
    - name: bullet
      TYPE: STRUCT(Bullet)
      REQUIRED: false
      comment: The bullet for this paragraph. If not present, the paragraph does not belong to a list.
    - name: style
      TYPE: STRUCT(ParagraphStyle)
      REQUIRED: false
      comment: The paragraph's style
  ParagraphStyle:
    - name: alignment
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ALIGNMENT_UNSPECIFIED
        - START
        - CENTER
        - END
        - JUSTIFIED
      comment: The text alignment for this paragraph.
    - name: direction
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - TEXT_DIRECTION_UNSPECIFIED
        - LEFT_TO_RIGHT
        - RIGHT_TO_LEFT
      comment: The text direction of this paragraph. If unset, the value defaults to LEFT_TO_RIGHT since text direction is not inherited.
    - name: indentEnd
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: The amount indentation for the paragraph on the side that corresponds to the end of the text, based on the current text direction. If unset, the value is inherited from the parent.
    - name: indentFirstLine
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: The amount of indentation for the start of the first line of the paragraph. If unset, the value is inherited from the parent.
    - name: indentStart
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: The amount indentation for the paragraph on the side that corresponds to the start of the text, based on the current text direction. If unset, the value is inherited from the parent.
    - name: lineSpacing
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The amount of space between lines, as a percentage of normal, where normal is represented as 100.0. If unset, the value is inherited from the parent.
    - name: spaceAbove
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: The amount of extra space above the paragraph. If unset, the value is inherited from the parent.
    - name: spaceBelow
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: The amount of extra space below the paragraph. If unset, the value is inherited from the parent.
    - name: spacingMode
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - SPACING_MODE_UNSPECIFIED
        - NEVER_COLLAPSE
        - COLLAPSE_LISTS
      comment: The spacing mode for the paragraph.
  Placeholder:
    - name: index
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The index of the placeholder. If the same placeholder types are present in the same page, they would have different index values.
    - name: parentObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of this shape's parent placeholder. If unset, the parent placeholder shape does not exist, so the shape does not inherit properties from any other shape.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - NONE
        - BODY
        - CHART
        - CLIP_ART
        - CENTERED_TITLE
        - DIAGRAM
        - DATE_AND_TIME
        - FOOTER
        - HEADER
        - MEDIA
        - OBJECT
        - PICTURE
        - SLIDE_NUMBER
        - SUBTITLE
        - TABLE
        - TITLE
        - SLIDE_IMAGE
      comment: The type of the placeholder.
  Presentation:
    - name: layouts
      TYPE: "[]STRUCT(Page)"
      REQUIRED: false
      comment: The layouts in the presentation. A layout is a template that determines how content is arranged and styled on the slides that inherit from that layout.
    - name: locale
      TYPE: STRING
      REQUIRED: false
      comment: The locale of the presentation, as an IETF BCP 47 language tag.
    - name: masters
      TYPE: "[]STRUCT(Page)"
      REQUIRED: false
      comment: "The slide masters in the presentation. A slide master contains all common page elements and the common properties for a set of layouts. They serve three purposes: - Placeholder shapes on a master contain the default text styles and shape properties of all placeholder shapes on pages that use that master. - The master page properties define the common page properties inherited by its layouts. - Any other shapes on the master slide appear on all slides using that master, regardless of their layout."
    - name: notesMaster
      TYPE: STRUCT(Page)
      REQUIRED: false
      comment: "The notes master in the presentation. It serves three purposes: - Placeholder shapes on a notes master contain the default text styles and shape properties of all placeholder shapes on notes pages. Specifically, a `SLIDE_IMAGE` placeholder shape contains the slide thumbnail, and a `BODY` placeholder shape contains the speaker notes. - The notes master page properties define the common page properties inherited by all notes pages. - Any other shapes on the notes master appear on all notes pages. The notes master is read-only."
    - name: pageSize
      TYPE: STRUCT(Size)
      REQUIRED: false
      comment: The size of pages in the presentation.
    - name: presentationId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the presentation.
    - name: revisionId
      TYPE: STRING
      REQUIRED: false
      comment: Output only. The revision ID of the presentation. Can be used in update requests to assert the presentation revision hasn't changed since the last read operation. Only populated if the user has edit access to the presentation. The revision ID is not a sequential number but a nebulous string. The format of the revision ID may change over time, so it should be treated opaquely. A returned revision ID is only guaranteed to be valid for 24 hours after it has been returned and cannot be shared across users. If the revision ID is unchanged between calls, then the presentation has not changed. Conversely, a changed ID (for the same presentation and user) usually means the presentation has been updated. However, a changed ID can also be due to internal factors such as ID format changes.
    - name: slides
      TYPE: "[]STRUCT(Page)"
      REQUIRED: false
      comment: The slides in the presentation. A slide inherits properties from a slide layout.
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: The title of the presentation.
  Range:
    - name: endIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The optional zero-based index of the end of the collection. Required for `FIXED_RANGE` ranges.
    - name: startIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The optional zero-based index of the beginning of the collection. Required for `FIXED_RANGE` and `FROM_START_INDEX` ranges.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RANGE_TYPE_UNSPECIFIED
        - FIXED_RANGE
        - FROM_START_INDEX
        - ALL
      comment: The type of range.
  Recolor:
    - name: name
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - NONE
        - LIGHT1
        - LIGHT2
        - LIGHT3
        - LIGHT4
        - LIGHT5
        - LIGHT6
        - LIGHT7
        - LIGHT8
        - LIGHT9
        - LIGHT10
        - DARK1
        - DARK2
        - DARK3
        - DARK4
        - DARK5
        - DARK6
        - DARK7
        - DARK8
        - DARK9
        - DARK10
        - GRAYSCALE
        - NEGATIVE
        - SEPIA
        - CUSTOM
      comment: The name of the recolor effect. The name is determined from the `recolor_stops` by matching the gradient against the colors in the page's current color scheme. This property is read-only.
    - name: recolorStops
      TYPE: "[]STRUCT(ColorStop)"
      REQUIRED: false
      comment: The recolor effect is represented by a gradient, which is a list of color stops. The colors in the gradient will replace the corresponding colors at the same position in the color palette and apply to the image. This property is read-only.
  RefreshSheetsChartRequest:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the chart to refresh.
  ReplaceAllShapesWithImageRequest:
    - name: containsText
      TYPE: STRUCT(SubstringMatchCriteria)
      REQUIRED: false
      comment: If set, this request will replace all of the shapes that contain the given text.
    - name: imageReplaceMethod
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - IMAGE_REPLACE_METHOD_UNSPECIFIED
        - CENTER_INSIDE
        - CENTER_CROP
      comment: The image replace method. If you specify both a `replace_method` and an `image_replace_method`, the `image_replace_method` takes precedence. If you do not specify a value for `image_replace_method`, but specify a value for `replace_method`, then the specified `replace_method` value is used. If you do not specify either, then CENTER_INSIDE is used.
    - name: imageUrl
      TYPE: STRING
      REQUIRED: false
      comment: The image URL. The image is fetched once at insertion time and a copy is stored for display inside the presentation. Images must be less than 50MB in size, cannot exceed 25 megapixels, and must be in one of PNG, JPEG, or GIF format. The provided URL can be at most 2 kB in length. The URL itself is saved with the image, and exposed via the Image.source_url field.
    - name: pageObjectIds
      TYPE: "[]STRING"
      REQUIRED: false
      comment: If non-empty, limits the matches to page elements only on the given pages. Returns a 400 bad request error if given the page object ID of a notes page or a notes master, or if a page with that object ID doesn't exist in the presentation.
    - name: replaceMethod
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - CENTER_INSIDE
        - CENTER_CROP
      DEPRECATED: true
      comment: "The replace method. *Deprecated*: use `image_replace_method` instead. If you specify both a `replace_method` and an `image_replace_method`, the `image_replace_method` takes precedence."
  ReplaceAllShapesWithImageResponse:
    - name: occurrencesChanged
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of shapes replaced with images.
  ReplaceAllShapesWithSheetsChartRequest:
    - name: chartId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the specific chart in the Google Sheets spreadsheet.
    - name: containsText
      TYPE: STRUCT(SubstringMatchCriteria)
      REQUIRED: false
      comment: The criteria that the shapes must match in order to be replaced. The request will replace all of the shapes that contain the given text.
    - name: linkingMode
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - NOT_LINKED_IMAGE
        - LINKED
      comment: The mode with which the chart is linked to the source spreadsheet. When not specified, the chart will be an image that is not linked.
    - name: pageObjectIds
      TYPE: "[]STRING"
      REQUIRED: false
      comment: If non-empty, limits the matches to page elements only on the given pages. Returns a 400 bad request error if given the page object ID of a notes page or a notes master, or if a page with that object ID doesn't exist in the presentation.
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the Google Sheets spreadsheet that contains the chart.
  ReplaceAllShapesWithSheetsChartResponse:
    - name: occurrencesChanged
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of shapes replaced with charts.
  ReplaceAllTextRequest:
    - name: containsText
      TYPE: STRUCT(SubstringMatchCriteria)
      REQUIRED: false
      comment: Finds text in a shape matching this substring.
    - name: pageObjectIds
      TYPE: "[]STRING"
      REQUIRED: false
      comment: If non-empty, limits the matches to page elements only on the given pages. Returns a 400 bad request error if given the page object ID of a notes master, or if a page with that object ID doesn't exist in the presentation.
    - name: replaceText
      TYPE: STRING
      REQUIRED: false
      comment: The text that will replace the matched text.
  ReplaceAllTextResponse:
    - name: occurrencesChanged
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of occurrences changed by replacing all text.
  ReplaceImageRequest:
    - name: imageObjectId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the existing image that will be replaced. The ID can be retrieved from the response of a get request.
    - name: imageReplaceMethod
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - IMAGE_REPLACE_METHOD_UNSPECIFIED
        - CENTER_INSIDE
        - CENTER_CROP
      comment: The replacement method.
    - name: url
      TYPE: STRING
      REQUIRED: false
      comment: The image URL. The image is fetched once at insertion time and a copy is stored for display inside the presentation. Images must be less than 50MB, cannot exceed 25 megapixels, and must be in PNG, JPEG, or GIF format. The provided URL can't surpass 2 KB in length. The URL is saved with the image, and exposed through the Image.source_url field.
  Request:
    - name: createImage
      TYPE: STRUCT(CreateImageRequest)
      REQUIRED: false
      comment: Creates an image.
    - name: createLine
      TYPE: STRUCT(CreateLineRequest)
      REQUIRED: false
      comment: Creates a line.
    - name: createParagraphBullets
      TYPE: STRUCT(CreateParagraphBulletsRequest)
      REQUIRED: false
      comment: Creates bullets for paragraphs.
    - name: createShape
      TYPE: STRUCT(CreateShapeRequest)
      REQUIRED: false
      comment: Creates a new shape.
    - name: createSheetsChart
      TYPE: STRUCT(CreateSheetsChartRequest)
      REQUIRED: false
      comment: Creates an embedded Google Sheets chart.
    - name: createSlide
      TYPE: STRUCT(CreateSlideRequest)
      REQUIRED: false
      comment: Creates a new slide.
    - name: createTable
      TYPE: STRUCT(CreateTableRequest)
      REQUIRED: false
      comment: Creates a new table.
    - name: createVideo
      TYPE: STRUCT(CreateVideoRequest)
      REQUIRED: false
      comment: Creates a video.
    - name: deleteObject
      TYPE: STRUCT(DeleteObjectRequest)
      REQUIRED: false
      comment: Deletes a page or page element from the presentation.
    - name: deleteParagraphBullets
      TYPE: STRUCT(DeleteParagraphBulletsRequest)
      REQUIRED: false
      comment: Deletes bullets from paragraphs.
    - name: deleteTableColumn
      TYPE: STRUCT(DeleteTableColumnRequest)
      REQUIRED: false
      comment: Deletes a column from a table.
    - name: deleteTableRow
      TYPE: STRUCT(DeleteTableRowRequest)
      REQUIRED: false
      comment: Deletes a row from a table.
    - name: deleteText
      TYPE: STRUCT(DeleteTextRequest)
      REQUIRED: false
      comment: Deletes text from a shape or a table cell.
    - name: duplicateObject
      TYPE: STRUCT(DuplicateObjectRequest)
      REQUIRED: false
      comment: Duplicates a slide or page element.
    - name: groupObjects
      TYPE: STRUCT(GroupObjectsRequest)
      REQUIRED: false
      comment: Groups objects, such as page elements.
    - name: insertTableColumns
      TYPE: STRUCT(InsertTableColumnsRequest)
      REQUIRED: false
      comment: Inserts columns into a table.
    - name: insertTableRows
      TYPE: STRUCT(InsertTableRowsRequest)
      REQUIRED: false
      comment: Inserts rows into a table.
    - name: insertText
      TYPE: STRUCT(InsertTextRequest)
      REQUIRED: false
      comment: Inserts text into a shape or table cell.
    - name: mergeTableCells
      TYPE: STRUCT(MergeTableCellsRequest)
      REQUIRED: false
      comment: Merges cells in a Table.
    - name: refreshSheetsChart
      TYPE: STRUCT(RefreshSheetsChartRequest)
      REQUIRED: false
      comment: Refreshes a Google Sheets chart.
    - name: replaceAllShapesWithImage
      TYPE: STRUCT(ReplaceAllShapesWithImageRequest)
      REQUIRED: false
      comment: Replaces all shapes matching some criteria with an image.
    - name: replaceAllShapesWithSheetsChart
      TYPE: STRUCT(ReplaceAllShapesWithSheetsChartRequest)
      REQUIRED: false
      comment: Replaces all shapes matching some criteria with a Google Sheets chart.
    - name: replaceAllText
      TYPE: STRUCT(ReplaceAllTextRequest)
      REQUIRED: false
      comment: Replaces all instances of specified text.
    - name: replaceImage
      TYPE: STRUCT(ReplaceImageRequest)
      REQUIRED: false
      comment: Replaces an existing image with a new image.
    - name: rerouteLine
      TYPE: STRUCT(RerouteLineRequest)
      REQUIRED: false
      comment: Reroutes a line such that it's connected at the two closest connection sites on the connected page elements.
    - name: ungroupObjects
      TYPE: STRUCT(UngroupObjectsRequest)
      REQUIRED: false
      comment: Ungroups objects, such as groups.
    - name: unmergeTableCells
      TYPE: STRUCT(UnmergeTableCellsRequest)
      REQUIRED: false
      comment: Unmerges cells in a Table.
    - name: updateImageProperties
      TYPE: STRUCT(UpdateImagePropertiesRequest)
      REQUIRED: false
      comment: Updates the properties of an Image.
    - name: updateLineCategory
      TYPE: STRUCT(UpdateLineCategoryRequest)
      REQUIRED: false
      comment: Updates the category of a line.
    - name: updateLineProperties
      TYPE: STRUCT(UpdateLinePropertiesRequest)
      REQUIRED: false
      comment: Updates the properties of a Line.
    - name: updatePageElementAltText
      TYPE: STRUCT(UpdatePageElementAltTextRequest)
      REQUIRED: false
      comment: Updates the alt text title and/or description of a page element.
    - name: updatePageElementTransform
      TYPE: STRUCT(UpdatePageElementTransformRequest)
      REQUIRED: false
      comment: Updates the transform of a page element.
    - name: updatePageElementsZOrder
      TYPE: STRUCT(UpdatePageElementsZOrderRequest)
      REQUIRED: false
      comment: Updates the Z-order of page elements.
    - name: updatePageProperties
      TYPE: STRUCT(UpdatePagePropertiesRequest)
      REQUIRED: false
      comment: Updates the properties of a Page.
    - name: updateParagraphStyle
      TYPE: STRUCT(UpdateParagraphStyleRequest)
      REQUIRED: false
      comment: Updates the styling of paragraphs within a Shape or Table.
    - name: updateShapeProperties
      TYPE: STRUCT(UpdateShapePropertiesRequest)
      REQUIRED: false
      comment: Updates the properties of a Shape.
    - name: updateSlideProperties
      TYPE: STRUCT(UpdateSlidePropertiesRequest)
      REQUIRED: false
      comment: Updates the properties of a Slide
    - name: updateSlidesPosition
      TYPE: STRUCT(UpdateSlidesPositionRequest)
      REQUIRED: false
      comment: Updates the position of a set of slides in the presentation.
    - name: updateTableBorderProperties
      TYPE: STRUCT(UpdateTableBorderPropertiesRequest)
      REQUIRED: false
      comment: Updates the properties of the table borders in a Table.
    - name: updateTableCellProperties
      TYPE: STRUCT(UpdateTableCellPropertiesRequest)
      REQUIRED: false
      comment: Updates the properties of a TableCell.
    - name: updateTableColumnProperties
      TYPE: STRUCT(UpdateTableColumnPropertiesRequest)
      REQUIRED: false
      comment: Updates the properties of a Table column.
    - name: updateTableRowProperties
      TYPE: STRUCT(UpdateTableRowPropertiesRequest)
      REQUIRED: false
      comment: Updates the properties of a Table row.
    - name: updateTextStyle
      TYPE: STRUCT(UpdateTextStyleRequest)
      REQUIRED: false
      comment: Updates the styling of text within a Shape or Table.
    - name: updateVideoProperties
      TYPE: STRUCT(UpdateVideoPropertiesRequest)
      REQUIRED: false
      comment: Updates the properties of a Video.
  RerouteLineRequest:
