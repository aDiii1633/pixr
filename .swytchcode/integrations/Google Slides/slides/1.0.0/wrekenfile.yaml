        - RIGHT_ARROW
        - RIGHT_ARROW_CALLOUT
        - RIGHT_BRACE
        - RIGHT_BRACKET
        - ROUND_1_RECTANGLE
        - ROUND_2_DIAGONAL_RECTANGLE
        - ROUND_2_SAME_RECTANGLE
        - RIGHT_TRIANGLE
        - SMILEY_FACE
        - SNIP_1_RECTANGLE
        - SNIP_2_DIAGONAL_RECTANGLE
        - SNIP_2_SAME_RECTANGLE
        - SNIP_ROUND_RECTANGLE
        - STAR_10
        - STAR_12
        - STAR_16
        - STAR_24
        - STAR_32
        - STAR_4
        - STAR_5
        - STAR_6
        - STAR_7
        - STAR_8
