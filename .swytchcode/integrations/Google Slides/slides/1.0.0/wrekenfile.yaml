      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the line to reroute. Only a line with a category indicating it is a "connector" can be rerouted. The start and end connections of the line must be on different page elements.
  Response:
    - name: createImage
      TYPE: STRUCT(CreateImageResponse)
      REQUIRED: false
      comment: The result of creating an image.
    - name: createLine
      TYPE: STRUCT(CreateLineResponse)
      REQUIRED: false
      comment: The result of creating a line.
    - name: createShape
      TYPE: STRUCT(CreateShapeResponse)
      REQUIRED: false
      comment: The result of creating a shape.
    - name: createSheetsChart
      TYPE: STRUCT(CreateSheetsChartResponse)
      REQUIRED: false
      comment: The result of creating a Google Sheets chart.
    - name: createSlide
      TYPE: STRUCT(CreateSlideResponse)
      REQUIRED: false
      comment: The result of creating a slide.
    - name: createTable
      TYPE: STRUCT(CreateTableResponse)
      REQUIRED: false
      comment: The result of creating a table.
    - name: createVideo
      TYPE: STRUCT(CreateVideoResponse)
      REQUIRED: false
      comment: The result of creating a video.
    - name: duplicateObject
      TYPE: STRUCT(DuplicateObjectResponse)
      REQUIRED: false
      comment: The result of duplicating an object.
    - name: groupObjects
      TYPE: STRUCT(GroupObjectsResponse)
      REQUIRED: false
      comment: The result of grouping objects.
    - name: replaceAllShapesWithImage
      TYPE: STRUCT(ReplaceAllShapesWithImageResponse)
      REQUIRED: false
      comment: The result of replacing all shapes matching some criteria with an image.
    - name: replaceAllShapesWithSheetsChart
      TYPE: STRUCT(ReplaceAllShapesWithSheetsChartResponse)
      REQUIRED: false
      comment: The result of replacing all shapes matching some criteria with a Google Sheets chart.
    - name: replaceAllText
      TYPE: STRUCT(ReplaceAllTextResponse)
      REQUIRED: false
      comment: The result of replacing text.
  RgbColor:
    - name: blue
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The blue component of the color, from 0.0 to 1.0.
    - name: green
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The green component of the color, from 0.0 to 1.0.
    - name: red
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The red component of the color, from 0.0 to 1.0.
  Shadow:
    - name: alignment
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RECTANGLE_POSITION_UNSPECIFIED
        - TOP_LEFT
        - TOP_CENTER
        - TOP_RIGHT
        - LEFT_CENTER
        - CENTER
        - RIGHT_CENTER
        - BOTTOM_LEFT
        - BOTTOM_CENTER
        - BOTTOM_RIGHT
      comment: The alignment point of the shadow, that sets the origin for translate, scale and skew of the shadow. This property is read-only.
    - name: alpha
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The alpha of the shadow's color, from 0.0 to 1.0.
    - name: blurRadius
      TYPE: STRUCT(Dimension)
      REQUIRED: false
      comment: The radius of the shadow blur. The larger the radius, the more diffuse the shadow becomes.
    - name: color
      TYPE: STRUCT(OpaqueColor)
      REQUIRED: false
      comment: The shadow color value.
    - name: propertyState
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RENDERED
        - NOT_RENDERED
        - INHERIT
      comment: The shadow property state. Updating the shadow on a page element will implicitly update this field to `RENDERED`, unless another value is specified in the same request. To have no shadow on a page element, set this field to `NOT_RENDERED`. In this case, any other shadow fields set in the same request will be ignored.
    - name: rotateWithShape
      TYPE: BOOL
      REQUIRED: false
      comment: Whether the shadow should rotate with the shape. This property is read-only.
    - name: transform
      TYPE: STRUCT(AffineTransform)
      REQUIRED: false
      comment: Transform that encodes the translate, scale, and skew of the shadow, relative to the alignment position.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - SHADOW_TYPE_UNSPECIFIED
        - OUTER
      comment: The type of the shadow. This property is read-only.
  Shape:
    - name: placeholder
      TYPE: STRUCT(Placeholder)
      REQUIRED: false
      comment: Placeholders are page elements that inherit from corresponding placeholders on layouts and masters. If set, the shape is a placeholder shape and any inherited properties can be resolved by looking at the parent placeholder identified by the Placeholder.parent_object_id field.
    - name: shapeProperties
      TYPE: STRUCT(ShapeProperties)
      REQUIRED: false
      comment: The properties of the shape.
    - name: shapeType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - TYPE_UNSPECIFIED
        - TEXT_BOX
        - RECTANGLE
        - ROUND_RECTANGLE
        - ELLIPSE
        - ARC
        - BENT_ARROW
