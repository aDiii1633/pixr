VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  w_base_url: https://slides.googleapis.com
METHODS:
  google_slides.presentation.create:
    SUMMARY: Creates a blank presentation using the title given in the request
    DESC: Creates a blank presentation using the title given in the request. If a `presentationId` is provided, it is used as the ID of the new presentation. Otherwise, a new ID is generated. Other fields in the request, including any provided content, are ignored. Returns the created presentation.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/presentations
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Presentation)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(Presentation)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Presentation)
        RETURNVAR: google_slides_presentation_create
        STATUS: 200
    CANONICAL_ID: google_slides.presentation.create
  google_slides.presentation.get:
    SUMMARY: Gets the latest version of the specified presentation.
    DESC: Gets the latest version of the specified presentation.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/presentations/{+presentationId}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - presentationId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(Presentation)
        RETURNVAR: google_slides_presentation_get
        STATUS: 200
    CANONICAL_ID: google_slides.presentation.get
  google_slides.page.get:
    SUMMARY: Gets the latest version of the specified page in the presentation.
    DESC: Gets the latest version of the specified page in the presentation.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/presentations/{presentationId}/pages/{pageObjectId}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - presentationId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - pageObjectId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(Page)
        RETURNVAR: google_slides_page_get
        STATUS: 200
    CANONICAL_ID: google_slides.page.get
  google_slides.page.thumbnail.get:
    SUMMARY: Generates a thumbnail of the latest version of the specified page in the presentation and returns a URL to the thumbnail image
    DESC: Generates a thumbnail of the latest version of the specified page in the presentation and returns a URL to the thumbnail image. This request counts as an [expensive read request](https://developers.google.com/workspace/slides/limits) for quota purposes.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/presentations/{presentationId}/pages/{pageObjectId}/thumbnail
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - presentationId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - pageObjectId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - thumbnailProperties.mimeType:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - PNG
      - thumbnailProperties.thumbnailSize:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - THUMBNAIL_SIZE_UNSPECIFIED
            - LARGE
            - MEDIUM
            - SMALL
            - WIDTH2000_PX
    RETURNS:
      - RETURNTYPE: STRUCT(Thumbnail)
        RETURNVAR: google_slides_page_thumbnail_get
        STATUS: 200
    CANONICAL_ID: google_slides.page.thumbnail.get
  google_slides.presentationidbatchupdate.create:
    SUMMARY: Applies one or more updates to the presentation
    DESC: "Applies one or more updates to the presentation. Each request is validated before being applied. If any request is not valid, then the entire request will fail and nothing will be applied. Some requests have replies to give you some information about how they are applied. Other requests do not need to return information; these each return an empty reply. The order of replies matches that of the requests. For example, suppose you call batchUpdate with four updates, and only the third one returns information. The response would have two empty replies: the reply to the third request, and another empty reply, in that order. Because other users may be editing the presentation, the presentation might not exactly reflect your changes: your changes may be altered with respect to collaborator changes. If there are no collaborators, the presentation should reflect your changes. In any case, the updates in your request are guaranteed to be applied together atomically."
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/presentations/{presentationId}:batchUpdate
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(BatchUpdatePresentationRequest)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/presentations
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - presentationId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(BatchUpdatePresentationRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(BatchUpdatePresentationResponse)
        RETURNVAR: google_slides_presentationidbatchupdate_create
        STATUS: 200
    CANONICAL_ID: google_slides.presentationidbatchupdate.create
STRUCTS:
  AffineTransform:
    - name: scaleX
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The X coordinate scaling element.
    - name: scaleY
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The Y coordinate scaling element.
    - name: shearX
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The X coordinate shearing element.
    - name: shearY
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The Y coordinate shearing element.
    - name: translateX
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The X coordinate translation element.
    - name: translateY
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The Y coordinate translation element.
    - name: unit
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - UNIT_UNSPECIFIED
        - EMU
        - PT
      comment: The units for translate elements.
  AutoText:
    - name: content
      TYPE: STRING
      REQUIRED: false
      comment: The rendered content of this auto text, if available.
    - name: style
      TYPE: STRUCT(TextStyle)
      REQUIRED: false
      comment: The styling applied to this auto text.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - TYPE_UNSPECIFIED
        - SLIDE_NUMBER
      comment: The type of this auto text.
  Autofit:
    - name: autofitType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - AUTOFIT_TYPE_UNSPECIFIED
        - NONE
        - TEXT_AUTOFIT
        - SHAPE_AUTOFIT
      comment: The autofit type of the shape. If the autofit type is AUTOFIT_TYPE_UNSPECIFIED, the autofit type is inherited from a parent placeholder if it exists. The field is automatically set to NONE if a request is made that might affect text fitting within its bounding text box. In this case, the font_scale is applied to the font_size and the line_spacing_reduction is applied to the line_spacing. Both properties are also reset to default values.
    - name: fontScale
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The font scale applied to the shape. For shapes with autofit_type NONE or SHAPE_AUTOFIT, this value is the default value of 1. For TEXT_AUTOFIT, this value multiplied by the font_size gives the font size that's rendered in the editor. This property is read-only.
    - name: lineSpacingReduction
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The line spacing reduction applied to the shape. For shapes with autofit_type NONE or SHAPE_AUTOFIT, this value is the default value of 0. For TEXT_AUTOFIT, this value subtracted from the line_spacing gives the line spacing that's rendered in the editor. This property is read-only.
  BatchUpdatePresentationRequest:
    - name: requests
      TYPE: "[]STRUCT(Request)"
      REQUIRED: false
      comment: A list of updates to apply to the presentation.
    - name: writeControl
      TYPE: STRUCT(WriteControl)
      REQUIRED: false
      comment: Provides control over how write requests are executed.
  BatchUpdatePresentationResponse:
    - name: presentationId
      TYPE: STRING
      REQUIRED: false
      comment: The presentation the updates were applied to.
    - name: replies
      TYPE: "[]STRUCT(Response)"
      REQUIRED: false
      comment: The reply of the updates. This maps 1:1 with the updates, although replies to some requests may be empty.
    - name: writeControl
      TYPE: STRUCT(WriteControl)
      REQUIRED: false
      comment: The updated write control after applying the request.
  Bullet:
    - name: bulletStyle
      TYPE: STRUCT(TextStyle)
      REQUIRED: false
      comment: The paragraph specific text style applied to this bullet.
    - name: glyph
      TYPE: STRING
      REQUIRED: false
      comment: The rendered bullet glyph for this paragraph.
    - name: listId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the list this paragraph belongs to.
    - name: nestingLevel
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The nesting level of this paragraph in the list.
  ColorScheme:
    - name: colors
      TYPE: "[]STRUCT(ThemeColorPair)"
      REQUIRED: false
      comment: The ThemeColorType and corresponding concrete color pairs.
  ColorStop:
    - name: alpha
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The alpha value of this color in the gradient band. Defaults to 1.0, fully opaque.
    - name: color
      TYPE: STRUCT(OpaqueColor)
      REQUIRED: false
      comment: The color of the gradient stop.
    - name: position
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The relative position of the color stop in the gradient band measured in percentage. The value should be in the interval [0.0, 1.0].
  CreateImageRequest:
    - name: elementProperties
      TYPE: STRUCT(PageElementProperties)
      REQUIRED: false
      comment: The element properties for the image. When the aspect ratio of the provided size does not match the image aspect ratio, the image is scaled and centered with respect to the size in order to maintain the aspect ratio. The provided transform is applied after this operation. The PageElementProperties.size property is optional. If you don't specify the size, the default size of the image is used. The PageElementProperties.transform property is optional. If you don't specify a transform, the image will be placed at the top-left corner of the page.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: A user-supplied object ID. If you specify an ID, it must be unique among all pages and page elements in the presentation. The ID must start with an alphanumeric character or an underscore (matches regex `[a-zA-Z0-9_]`); remaining characters may include those as well as a hyphen or colon (matches regex `[a-zA-Z0-9_-:]`). The length of the ID must not be less than 5 or greater than 50. If you don't specify an ID, a unique one is generated.
    - name: url
      TYPE: STRING
      REQUIRED: false
      comment: The image URL. The image is fetched once at insertion time and a copy is stored for display inside the presentation. Images must be less than 50 MB in size, can't exceed 25 megapixels, and must be in one of PNG, JPEG, or GIF formats. The provided URL must be publicly accessible and up to 2 KB in length. The URL is saved with the image, and exposed through the Image.source_url field.
  CreateImageResponse:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the created image.
  CreateLineRequest:
    - name: category
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - LINE_CATEGORY_UNSPECIFIED
        - STRAIGHT
        - BENT
        - CURVED
      comment: The category of the line to be created. The exact line type created is determined based on the category and how it's routed to connect to other page elements. If you specify both a `category` and a `line_category`, the `category` takes precedence. If you do not specify a value for `category`, but specify a value for `line_category`, then the specified `line_category` value is used. If you do not specify either, then STRAIGHT is used.
    - name: elementProperties
      TYPE: STRUCT(PageElementProperties)
      REQUIRED: false
      comment: The element properties for the line.
    - name: lineCategory
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - STRAIGHT
        - BENT
        - CURVED
      DEPRECATED: true
      comment: "The category of the line to be created. *Deprecated*: use `category` instead. The exact line type created is determined based on the category and how it's routed to connect to other page elements. If you specify both a `category` and a `line_category`, the `category` takes precedence."
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: A user-supplied object ID. If you specify an ID, it must be unique among all pages and page elements in the presentation. The ID must start with an alphanumeric character or an underscore (matches regex `[a-zA-Z0-9_]`); remaining characters may include those as well as a hyphen or colon (matches regex `[a-zA-Z0-9_-:]`). The length of the ID must not be less than 5 or greater than 50. If you don't specify an ID, a unique one is generated.
  CreateLineResponse:
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the created line.
  CreateParagraphBulletsRequest:
    - name: bulletPreset
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - BULLET_DISC_CIRCLE_SQUARE
        - BULLET_DIAMONDX_ARROW3D_SQUARE
        - BULLET_CHECKBOX
        - BULLET_ARROW_DIAMOND_DISC
        - BULLET_STAR_CIRCLE_SQUARE
        - BULLET_ARROW3D_CIRCLE_SQUARE
        - BULLET_LEFTTRIANGLE_DIAMOND_DISC
        - BULLET_DIAMONDX_HOLLOWDIAMOND_SQUARE
        - BULLET_DIAMOND_CIRCLE_SQUARE
        - NUMBERED_DIGIT_ALPHA_ROMAN
        - NUMBERED_DIGIT_ALPHA_ROMAN_PARENS
        - NUMBERED_DIGIT_NESTED
        - NUMBERED_UPPERALPHA_ALPHA_ROMAN
        - NUMBERED_UPPERROMAN_UPPERALPHA_DIGIT
        - NUMBERED_ZERODIGIT_ALPHA_ROMAN
      comment: The kinds of bullet glyphs to be used. Defaults to the `BULLET_DISC_CIRCLE_SQUARE` preset.
    - name: cellLocation
      TYPE: STRUCT(TableCellLocation)
      REQUIRED: false
      comment: The optional table cell location if the text to be modified is in a table cell. If present, the object_id must refer to a table.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: The object ID of the shape or table containing the text to add bullets to.
    - name: textRange
      TYPE: STRUCT(Range)
      REQUIRED: false
      comment: The range of text to apply the bullet presets to, based on TextElement indexes.
  CreateShapeRequest:
    - name: elementProperties
      TYPE: STRUCT(PageElementProperties)
      REQUIRED: false
      comment: The element properties for the shape.
    - name: objectId
      TYPE: STRING
      REQUIRED: false
      comment: A user-supplied object ID. If you specify an ID, it must be unique among all pages and page elements in the presentation. The ID must start with an alphanumeric character or an underscore (matches regex `[a-zA-Z0-9_]`); remaining characters may include those as well as a hyphen or colon (matches regex `[a-zA-Z0-9_-:]`). The length of the ID must not be less than 5 or greater than 50. If empty, a unique identifier will be generated.
    - name: shapeType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - TYPE_UNSPECIFIED
        - TEXT_BOX
        - RECTANGLE
        - ROUND_RECTANGLE
        - ELLIPSE
        - ARC
        - BENT_ARROW
        - BENT_UP_ARROW
        - BEVEL
