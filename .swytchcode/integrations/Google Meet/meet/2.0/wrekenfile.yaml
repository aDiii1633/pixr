VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  w_base_url: https://meet.googleapis.com
METHODS:
  google_meet.conferencerecord.list:
    SUMMARY: Lists the conference records
    DESC: Lists the conference records. By default, ordered by start time and in descending order.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/conferenceRecords
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - filter:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ListConferenceRecordsResponse)
        RETURNVAR: google_meet_conferencerecord_list
        STATUS: 200
    CANONICAL_ID: google_meet.conferencerecord.list
  google_meet.space.create:
    SUMMARY: Creates a space.
    DESC: Creates a space.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/spaces
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Space)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(Space)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Space)
        RETURNVAR: google_meet_space_create
        STATUS: 200
    CANONICAL_ID: google_meet.space.create
  google_meet.resource.execute:
    SUMMARY: Gets a recording by recording ID.
    DESC: Gets a recording by recording ID.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/{+name}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.settings
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.settings
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - name:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(Recording)
        RETURNVAR: google_meet_resource_execute
        STATUS: 200
    CANONICAL_ID: google_meet.resource.execute
  google_meet.resource.execute1:
    SUMMARY: Updates details about a meeting space
    DESC: Updates details about a meeting space. For an example, see [Update a meeting space](https://developers.google.com/workspace/meet/api/guides/meeting-spaces#update-meeting-space).
    HTTP:
      METHOD: PATCH
      ENDPOINT: /v2/{+name}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Space)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.settings
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.settings
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - name:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - updateMask:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - body:
          TYPE: STRUCT(Space)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Space)
        RETURNVAR: google_meet_resource_execute1
        STATUS: 200
    CANONICAL_ID: google_meet.resource.execute1
  google_meet.nameendactiveconference.create:
    SUMMARY: Ends an active conference (if there's one)
    DESC: Ends an active conference (if there's one). For an example, see [End active conference](https://developers.google.com/workspace/meet/api/guides/meeting-spaces#end-active-conference).
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/{+name}:endActiveConference
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(EndActiveConferenceRequest)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - name:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(EndActiveConferenceRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Empty)
        RETURNVAR: google_meet_nameendactiveconference_create
        STATUS: 200
    CANONICAL_ID: google_meet.nameendactiveconference.create
  google_meet.entry.get:
    SUMMARY: Lists the structured transcript entries per transcript
    DESC: "Lists the structured transcript entries per transcript. By default, ordered by start time and in ascending order. Note: The transcript entries returned by the Google Meet API might not match the transcription found in the Google Docs transcript file. This can occur when 1) we have interleaved speakers within milliseconds, or 2) the Google Docs transcript file is modified after generation."
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/{+parent}/entries
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - parent:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ListTranscriptEntriesResponse)
        RETURNVAR: google_meet_entry_get
        STATUS: 200
    CANONICAL_ID: google_meet.entry.get
  google_meet.participantsession.get:
    SUMMARY: Lists the participant sessions of a participant in a conference record
    DESC: Lists the participant sessions of a participant in a conference record. By default, ordered by join time and in descending order. This API supports `fields` as standard parameters like every other API. However, when the `fields` request parameter is omitted this API defaults to `'participantsessions/*, next_page_token'`.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/{+parent}/participantSessions
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - parent:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - filter:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ListParticipantSessionsResponse)
        RETURNVAR: google_meet_participantsession_get
        STATUS: 200
    CANONICAL_ID: google_meet.participantsession.get
  google_meet.participant.get:
    SUMMARY: Lists the participants in a conference record
    DESC: Lists the participants in a conference record. By default, ordered by join time and in descending order. This API supports `fields` as standard parameters like every other API. However, when the `fields` request parameter is omitted, this API defaults to `'participants/*, next_page_token'`.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/{+parent}/participants
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - parent:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - filter:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ListParticipantsResponse)
        RETURNVAR: google_meet_participant_get
        STATUS: 200
    CANONICAL_ID: google_meet.participant.get
  google_meet.recording.get:
    SUMMARY: Lists the recording resources from the conference record
    DESC: Lists the recording resources from the conference record. By default, ordered by start time and in ascending order.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/{+parent}/recordings
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - parent:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ListRecordingsResponse)
        RETURNVAR: google_meet_recording_get
        STATUS: 200
    CANONICAL_ID: google_meet.recording.get
  google_meet.smartnote.get:
    SUMMARY: Lists the set of smart notes from the conference record
    DESC: Lists the set of smart notes from the conference record. By default, ordered by start time and in ascending order.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/{+parent}/smartNotes
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - parent:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ListSmartNotesResponse)
        RETURNVAR: google_meet_smartnote_get
        STATUS: 200
    CANONICAL_ID: google_meet.smartnote.get
  google_meet.transcript.get:
    SUMMARY: Lists the set of transcripts from the conference record
    DESC: Lists the set of transcripts from the conference record. By default, ordered by start time and in ascending order.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/{+parent}/transcripts
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.created
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/meetings.space.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - parent:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ListTranscriptsResponse)
        RETURNVAR: google_meet_transcript_get
        STATUS: 200
    CANONICAL_ID: google_meet.transcript.get
STRUCTS:
  ActiveConference:
    - name: conferenceRecord
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: "Output only. Reference to 'ConferenceRecord' resource. Format: `conferenceRecords/{conference_record}` where `{conference_record}` is a unique ID for each instance of a call within a space."
  AnonymousUser:
    - name: displayName
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. User provided name when they join a conference anonymously.
  ArtifactConfig:
    - name: recordingConfig
      TYPE: STRUCT(RecordingConfig)
      REQUIRED: false
      comment: Configuration for recording.
    - name: smartNotesConfig
      TYPE: STRUCT(SmartNotesConfig)
      REQUIRED: false
      comment: Configuration for auto-smart-notes.
    - name: transcriptionConfig
      TYPE: STRUCT(TranscriptionConfig)
      REQUIRED: false
      comment: Configuration for auto-transcript.
  ConferenceRecord:
    - name: endTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Timestamp when the conference ended. Set for past conferences. Unset if the conference is ongoing.
    - name: expireTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Server enforced expiration time for when this conference record resource is deleted. The resource is deleted 30 days after the conference ends.
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: "Identifier. Resource name of the conference record. Format: `conferenceRecords/{conference_record}` where `{conference_record}` is a unique ID for each instance of a call within a space."
    - name: space
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The space where the conference was held.
    - name: startTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Timestamp when the conference started. Always set.
  DocsDestination:
    - name: document
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The document ID for the underlying Google Docs transcript file. For example, "1kuceFZohVoCh6FulBHxwy6I15Ogpc4hP". Use the `documents.get` method of the Google Docs API (https://developers.google.com/docs/api/reference/rest/v1/documents/get) to fetch the content.
    - name: exportUri
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. URI for the Google Docs transcript file. Use `https://docs.google.com/document/d/{$DocumentId}/view` to browse the transcript in the browser.
  DriveDestination:
    - name: exportUri
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. Link used to play back the recording file in the browser. For example, `https://drive.google.com/file/d/{$fileId}/view`.
    - name: file
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The `fileId` for the underlying MP4 file. For example, "1kuceFZohVoCh6FulBHxwy6I15Ogpc4hP". Use `$ GET https://www.googleapis.com/drive/v3/files/{$fileId}?alt=media` to download the blob. For more information, see https://developers.google.com/drive/api/v3/reference/files/get.
  Empty:
    - name: value
      TYPE: ANY
      REQUIRED: false
  EndActiveConferenceRequest:
    - name: value
      TYPE: ANY
      REQUIRED: false
  GatewaySipAccess:
    - name: sipAccessCode
      TYPE: STRING
      REQUIRED: false
      comment: The permanent numeric code for manual entry on specially configured devices.
    - name: uri
      TYPE: STRING
      REQUIRED: false
      comment: "The Session Initiation Protocol (SIP) URI the conference can be reached through. The string is in one of these formats: * \"sip:USER_ID@GATEWAY_ADDRESS\" * \"sips:USER_ID@GATEWAY_ADDRESS\" where USER_ID is the 13-digit universal pin (with the future option to support using a Meet meeting code as well), and GATEWAY_ADDRESS is a valid address to be resolved using a DNS SRV lookup, or a dotted quad."
  ListConferenceRecordsResponse:
    - name: conferenceRecords
      TYPE: "[]STRUCT(ConferenceRecord)"
      REQUIRED: false
      comment: List of conferences in one page.
    - name: nextPageToken
      TYPE: STRING
      REQUIRED: false
      comment: Token to be circulated back for further List call if current List does NOT include all the Conferences. Unset if all conferences have been returned.
  ListParticipantSessionsResponse:
    - name: nextPageToken
      TYPE: STRING
      REQUIRED: false
      comment: Token to be circulated back for further List call if current List doesn't include all the participants. Unset if all participants are returned.
    - name: participantSessions
      TYPE: "[]STRUCT(ParticipantSession)"
      REQUIRED: false
      comment: List of participants in one page.
  ListParticipantsResponse:
    - name: nextPageToken
      TYPE: STRING
      REQUIRED: false
      comment: Token to be circulated back for further List call if current List doesn't include all the participants. Unset if all participants are returned.
    - name: participants
      TYPE: "[]STRUCT(Participant)"
      REQUIRED: false
      comment: List of participants in one page.
    - name: totalSize
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Total, exact number of `participants`. By default, this field isn't included in the response. Set the field mask in [SystemParameterContext](https://cloud.google.com/apis/docs/system-parameters) to receive this field in the response.
  ListRecordingsResponse:
    - name: nextPageToken
      TYPE: STRING
      REQUIRED: false
      comment: Token to be circulated back for further List call if current List doesn't include all the recordings. Unset if all recordings are returned.
    - name: recordings
      TYPE: "[]STRUCT(Recording)"
      REQUIRED: false
      comment: List of recordings in one page.
  ListSmartNotesResponse:
    - name: nextPageToken
      TYPE: STRING
      REQUIRED: false
      comment: Token to be circulated back for further List call if current List doesn't include all the smart notes. Unset if all smart notes are returned.
    - name: smartNotes
      TYPE: "[]STRUCT(SmartNote)"
      REQUIRED: false
      comment: List of smart notes in one page.
  ListTranscriptEntriesResponse:
    - name: nextPageToken
      TYPE: STRING
      REQUIRED: false
      comment: Token to be circulated back for further List call if current List doesn't include all the transcript entries. Unset if all entries are returned.
    - name: transcriptEntries
      TYPE: "[]STRUCT(TranscriptEntry)"
      REQUIRED: false
      comment: List of TranscriptEntries in one page.
  ListTranscriptsResponse:
    - name: nextPageToken
      TYPE: STRING
      REQUIRED: false
      comment: Token to be circulated back for further List call if current List doesn't include all the transcripts. Unset if all transcripts are returned.
    - name: transcripts
      TYPE: "[]STRUCT(Transcript)"
      REQUIRED: false
      comment: List of transcripts in one page.
  ModerationRestrictions:
    - name: chatRestriction
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RESTRICTION_TYPE_UNSPECIFIED
        - HOSTS_ONLY
        - NO_RESTRICTION
      comment: Defines who has permission to send chat messages in the meeting space.
    - name: defaultJoinAsViewerType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DEFAULT_JOIN_AS_VIEWER_TYPE_UNSPECIFIED
        - "ON"
        - "OFF"
      comment: Defines whether to restrict the default role assigned to users as viewer.
    - name: presentRestriction
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RESTRICTION_TYPE_UNSPECIFIED
        - HOSTS_ONLY
        - NO_RESTRICTION
      comment: Defines who has permission to share their screen in the meeting space.
    - name: reactionRestriction
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RESTRICTION_TYPE_UNSPECIFIED
        - HOSTS_ONLY
        - NO_RESTRICTION
      comment: Defines who has permission to send reactions in the meeting space.
  Participant:
    - name: anonymousUser
      TYPE: STRUCT(AnonymousUser)
      REQUIRED: false
      comment: Anonymous user.
    - name: earliestStartTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Time when the participant first joined the meeting.
    - name: latestEndTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Time when the participant left the meeting for the last time. This can be null if it's an active meeting.
    - name: name
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: "Output only. Resource name of the participant. Format: `conferenceRecords/{conference_record}/participants/{participant}`"
    - name: phoneUser
      TYPE: STRUCT(PhoneUser)
      REQUIRED: false
      comment: User calling from their phone.
    - name: signedinUser
      TYPE: STRUCT(SignedinUser)
      REQUIRED: false
      comment: Signed-in user.
  ParticipantSession:
    - name: endTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Timestamp when the user session ends. Unset if the user session hasn’t ended.
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: Identifier. Session id.
    - name: startTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Timestamp when the user session starts.
  PhoneAccess:
    - name: languageCode
      TYPE: STRING
      REQUIRED: false
      comment: "The BCP 47/LDML language code for the language associated with this phone access. To be parsed by the i18n LanguageCode utility. Examples: \"es-419\" for Latin American Spanish, \"fr-CA\" for Canadian French."
    - name: phoneNumber
      TYPE: STRING
      REQUIRED: false
      comment: The phone number to dial for this meeting space in E.164 format. Full phone number with a leading '+' character.
    - name: pin
      TYPE: STRING
      REQUIRED: false
      comment: The PIN that users must enter after dialing the given number. The PIN consists of only decimal digits and the length may vary.
    - name: regionCode
      TYPE: STRING
      REQUIRED: false
      comment: "The CLDR/ISO 3166 region code for the country associated with this phone access. To be parsed by the i18n RegionCode utility. Example: \"SE\" for Sweden."
  PhoneUser:
    - name: displayName
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. Partially redacted user's phone number when calling.
  Recording:
    - name: driveDestination
      TYPE: STRUCT(DriveDestination)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. Recording is saved to Google Drive as an MP4 file. The `drive_destination` includes the Drive `fileId` that can be used to download the file using the `files.get` method of the Drive API.
    - name: endTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Timestamp when the recording ended.
    - name: name
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: "Output only. Resource name of the recording. Format: `conferenceRecords/{conference_record}/recordings/{recording}` where `{recording}` is a 1:1 mapping to each unique recording session during the conference."
    - name: startTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Timestamp when the recording started.
    - name: state
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - STATE_UNSPECIFIED
        - STARTED
        - ENDED
        - FILE_GENERATED
      READ_ONLY: true
      comment: Output only. Current state.
  RecordingConfig:
    - name: autoRecordingGeneration
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - AUTO_GENERATION_TYPE_UNSPECIFIED
        - "ON"
        - "OFF"
      comment: Defines whether a meeting space is automatically recorded when someone with the privilege to record joins the meeting.
  SignedinUser:
    - name: displayName
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. For a personal device, it's the user's first name and last name. For a robot account, it's the administrator-specified device name. For example, "Altostrat Room".
    - name: user
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: "Output only. Unique ID for the user. Interoperable with Admin SDK API and People API. Format: `users/{user}`"
  SmartNote:
    - name: docsDestination
      TYPE: STRUCT(DocsDestination)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The Google Doc destination where the smart notes are saved.
    - name: endTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Timestamp when the smart notes stopped.
    - name: name
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: "Output only. Identifier. Resource name of the smart notes. Format: `conferenceRecords/{conference_record}/smartNotes/{smart_note}`, where `{smart_note}` is a 1:1 mapping to each unique smart notes session of the conference."
    - name: startTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Timestamp when the smart notes started.
    - name: state
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - STATE_UNSPECIFIED
        - STARTED
        - ENDED
        - FILE_GENERATED
      READ_ONLY: true
      comment: Output only. Current state.
  SmartNotesConfig:
    - name: autoSmartNotesGeneration
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - AUTO_GENERATION_TYPE_UNSPECIFIED
        - "ON"
        - "OFF"
      comment: Defines whether to automatically generate a summary and recap of the meeting for all invitees in the organization when someone with the privilege to enable smart notes joins the meeting.
  Space:
    - name: activeConference
      TYPE: STRUCT(ActiveConference)
      REQUIRED: false
      comment: Active conference, if it exists.
    - name: config
      TYPE: STRUCT(SpaceConfig)
      REQUIRED: false
      comment: Configuration pertaining to the meeting space.
    - name: gatewaySipAccess
      TYPE: "[]STRUCT(GatewaySipAccess)"
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The SIP-based access methods that can be used to join the conference. Can be empty.
    - name: meetingCode
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: "Output only. Type friendly unique string used to join the meeting. Format: `[a-z]+-[a-z]+-[a-z]+`. For example, `abc-mnop-xyz`. The maximum length is 128 characters. Can only be used as an alias of the space name to get the space."
    - name: meetingUri
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. URI used to join meetings consisting of `https://meet.google.com/` followed by the `meeting_code`. For example, `https://meet.google.com/abc-mnop-xyz`.
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: "Immutable. Resource name of the space. Format: `spaces/{space}`. `{space}` is the resource identifier for the space. It's a unique, server-generated ID and is case sensitive. For example, `jQCFfuBOdN5z`. For more information, see [How Meet identifies a meeting space](https://developers.google.com/workspace/meet/api/guides/meeting-spaces#identify-meeting-space)."
    - name: phoneAccess
      TYPE: "[]STRUCT(PhoneAccess)"
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. All regional phone access methods for this meeting space. Can be empty.
  SpaceConfig:
    - name: accessType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ACCESS_TYPE_UNSPECIFIED
        - OPEN
        - TRUSTED
        - RESTRICTED
      comment: "Access type of the meeting space that determines who can join without knocking. Default: The user's default access settings. Controlled by the user's admin for enterprise users or RESTRICTED."
    - name: artifactConfig
      TYPE: STRUCT(ArtifactConfig)
      REQUIRED: false
      comment: Configuration pertaining to the auto-generated artifacts that the meeting supports.
    - name: attendanceReportGenerationType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ATTENDANCE_REPORT_GENERATION_TYPE_UNSPECIFIED
        - GENERATE_REPORT
        - DO_NOT_GENERATE
      comment: Whether attendance report is enabled for the meeting space.
    - name: entryPointAccess
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ENTRY_POINT_ACCESS_UNSPECIFIED
        - ALL
        - CREATOR_APP_ONLY
      comment: "Defines the entry points that can be used to join meetings hosted in this meeting space. Default: EntryPointAccess.ALL"
    - name: moderation
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - MODERATION_UNSPECIFIED
        - "OFF"
        - "ON"
      comment: "The pre-configured moderation mode for the Meeting. Default: Controlled by the user's policies."
    - name: moderationRestrictions
      TYPE: STRUCT(ModerationRestrictions)
      REQUIRED: false
      comment: When moderation.ON, these restrictions go into effect for the meeting. When moderation.OFF, will be reset to default ModerationRestrictions.
  Transcript:
    - name: docsDestination
      TYPE: STRUCT(DocsDestination)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. Where the Google Docs transcript is saved.
    - name: endTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Timestamp when the transcript stopped.
    - name: name
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: "Output only. Resource name of the transcript. Format: `conferenceRecords/{conference_record}/transcripts/{transcript}`, where `{transcript}` is a 1:1 mapping to each unique transcription session of the conference."
    - name: startTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Timestamp when the transcript started.
    - name: state
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - STATE_UNSPECIFIED
        - STARTED
        - ENDED
        - FILE_GENERATED
      READ_ONLY: true
      comment: Output only. Current state.
  TranscriptEntry:
    - name: endTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Timestamp when the transcript entry ended.
    - name: languageCode
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. Language of spoken text, such as "en-US". IETF BCP 47 syntax (https://tools.ietf.org/html/bcp47)
    - name: name
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: "Output only. Resource name of the entry. Format: \"conferenceRecords/{conference_record}/transcripts/{transcript}/entries/{entry}\""
    - name: participant
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. Refers to the participant who speaks.
    - name: startTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. Timestamp when the transcript entry started.
    - name: text
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The transcribed text of the participant's voice, at maximum 10K words. Note that the limit is subject to change.
  TranscriptionConfig:
    - name: autoTranscriptionGeneration
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - AUTO_GENERATION_TYPE_UNSPECIFIED
        - "ON"
        - "OFF"
      comment: Defines whether the content of a meeting is automatically transcribed when someone with the privilege to transcribe joins the meeting.
